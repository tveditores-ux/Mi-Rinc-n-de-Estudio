renciaCapitulo:E,versiculos:h,comparacion:L,cargando:V,error:P,enLinea:ee,seleccion:I,versoObjetivo:je,versiculosSeleccionados:de,referenciaSeleccion:te,navegar:O,irA:Ae,irAReferencia:Ne,capituloSiguiente:x,capituloAnterior:w,alternarVerso:G,limpiarSeleccion:X,seleccionarTodo:be,textoParaCopiar:Oe,htmlParaInsertar:Ca,historial:m,limpiarHistorial:()=>f([]),marcadores:b,guardarMarcador:pa,quitarMarcador:We,busqueda:U,buscar:go,masResultados:Ga,descarga:K,descargarNVI:no,borrarCache:Qa,ajustes:d,actualizarAjustes:so}}function Zv({docs:r,referenciaInicial:c,onReferenciaConsumida:d,onIrEscritorio:l}){const m=Zf(),f=yf(),[b,N]=y.useState(null),h=y.useRef(!1);y.useEffect(()=>{if(!c||h.current)return;h.current=!0;const V=window.setTimeout(()=>{m.irA(c),d?.()},0);return()=>window.clearTimeout(V)},[c]);const v=y.useRef(f.detener);v.current=f.detener,y.useEffect(()=>()=>v.current(),[]);const L=V=>{N(V),window.setTimeout(()=>N(null),2200)},T=r.activo;return s.jsxs("div",{className:"relative flex h-[calc(100vh-44px)] flex-col overflow-hidden bg-pergamino-100",children:[s.jsxs("div",{className:"mx-auto flex min-h-0 w-full max-w-5xl flex-1 flex-col px-0 py-0 sm:px-6 sm:py-5",children:[s.jsx("div",{className:"min-h-0 flex-1 overflow-hidden bg-white shadow-elevada sm:rounded-2xl sm:border sm:border-pergamino-300",children:s.jsx(Xf,{biblia:m,voz:f,modo:"pagina",onInsertar:T?V=>{r.anexarHtml(T.id,V)}:void 0,etiquetaInsertar:T?`Añadir a «${r.obtenerTitulo(T)}»`:"Añadir al mensaje",onAviso:L})}),s.jsxs("div",{className:"flex items-center justify-between px-4 py-2 font-sans text-[11px] text-tinta-500 sm:px-1",children:[s.jsx("span",{children:T?s.jsxs(s.Fragment,{children:["Los versículos se añaden al final de ",s.jsx("strong",{className:"text-tinta-800",children:r.obtenerTitulo(T)}),"."]}):"No hay un mensaje activo."}),s.jsx("button",{type:"button",onClick:l,className:"font-semibold text-vino-700 hover:text-vino-900",children:"Ir al escritorio →"})]})]}),b&&s.jsx("div",{className:"pointer-events-none absolute bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full bg-tinta-900 px-4 py-2 font-sans text-sm text-pergamino-50 shadow-elevada",children:b})]})}const Kv=[{id:"el-pastor-que-fue-a-buscarte",numero:43,serie:1,titulo:"El pastor que fue a buscarte",subtitulo:"La oveja no regresa: la cargan",etiquetas:["Oveja perdida","Lucas 15","Identidad","Seguridad"],necesidades:["culpa","miedo","pasado","cansancio"],textoBase:{referencia:"Lucas 15:4-7",texto:"¿Qué hombre de vosotros, teniendo cien ovejas, si pierde una de ellas, no deja las noventa y nueve en el desierto, y va tras la que se perdió, hasta encontrarla? Y cuando la encuentra, la pone sobre sus hombros gozoso; y al llegar a casa, reúne a sus amigos y vecinos, diciéndoles: Gozaos conmigo, porque he encontrado mi oveja que se había perdido. Os digo que así habrá más gozo en el cielo por un pecador que se arrepiente, que por noventa y nueve justos que no necesitan de arrepentimiento.",version:"RVR1960"},textoBaseNVI:"Supongamos que uno de ustedes tiene cien ovejas y pierde una de ellas. ¿No deja las noventa y nueve en el campo y va en busca de la oveja perdida hasta encontrarla? Y cuando la encuentra, muy contento la carga en los hombros y vuelve a la casa. Al llegar, reúne a sus amigos y vecinos, y les dice: “Alégrense conmigo; ya encontré la oveja que se me había perdido”. Les digo que así es también en el cielo: habrá más alegría por un solo pecador que se arrepienta, que por noventa y nueve justos que no necesitan arrepentirse».",textosApoyo:["Lucas 15:1-7","Mateo 18:12-14","Ezequiel 34:1-16","Salmo 23","Isaías 53:6","Juan 10:11-15, 27-29","Hebreos 13:20-21","1 Pedro 2:24-25","Romanos 8:38-39","Jeremías 31:31-34"],ideaCentral:"En la parábola de la oveja perdida todos los verbos importantes son del pastor: deja, va, busca, encuentra, carga, vuelve, reúne. La oveja solo hace una cosa: perderse. Bajo el nuevo pacto, la salvación no descansa en qué tan bien se agarra la oveja del Pastor, sino en que el Pastor —el que dio su vida y fue levantado «por la sangre del pacto eterno»— la lleva sobre sus hombros hasta la casa. Jesús no responde a la murmuración de los religiosos defendiéndose: se identifica con el Dios de Ezequiel 34 que promete «yo mismo buscaré mis ovejas».",porQueNoConvencional:"Esta parábola casi siempre se predica como un mandato evangelístico («ve a buscar a los perdidos») o como una invitación a que la oveja «regrese al redil». Ambas lecturas son legítimas, pero pierden el centro del texto: aquí no hay oveja que regrese. Jesús la pinta cargada, pasiva, rescatada. Este tema devuelve la parábola a su primer sentido —un retrato del corazón de Dios— y muestra cómo el nuevo pacto convierte esa promesa en una seguridad: el Pastor que te buscó es el mismo que ahora te sostiene.",contexto:["Lucas 15 abre con dos grupos que se acercan a Jesús por motivos opuestos. Los recaudadores de impuestos y «pecadores» se le acercaban habitualmente (el verbo griego indica una costumbre, no una visita aislada) para oírlo; los fariseos y maestros de la ley, en cambio, «murmuraban», un sonido que recuerda las quejas de Israel en el desierto (Éxodo 16:2). Lo que les escandaliza no es que Jesús hable con pecadores, sino que «come con ellos»: en aquella cultura, compartir la mesa era declarar aceptación y comunión. La respuesta de Jesús es una sola «parábola» (v. 3, en singular) contada en tres escenas: la oveja, la moneda y los dos hijos.","Para un oyente judío, la imagen del pastor no era neutral. Dios es el pastor de Israel (Salmo 23; 80:1). Y Ezequiel 34 había denunciado a los pastores de Israel: se alimentaban a sí mismos, no fortalecían a la débil, no curaban a la enferma, «ni buscaron a la perdida» (v. 4). Frente a ellos, Dios promete: «Yo mismo buscaré a mis ovejas» (v. 11). Cuando los fariseos critican a Jesús por buscar a los perdidos, Él no discute: les recuerda de qué lado de Ezequiel 34 están ellos. Y se coloca en el lado de Dios.","La escena misma es realista. Cien ovejas es un rebaño considerable, no una mascota; perder una es perder aproximadamente el uno por ciento, un costo tolerable para cualquier cálculo económico. Sin embargo, el pastor no calcula. La oveja doméstica, como saben quienes las crían, se extravía con facilidad y, a diferencia de otros animales, tiende a quedarse paralizada o dando vueltas, sin saber volver por sí misma. Por eso la búsqueda es su única esperanza. El «campo» (RVR: «desierto») no es una tierra devastada sino el pastizal abierto donde se apacienta el rebaño.","Mateo 18:12-14 recoge la misma imagen con otro auditorio y otro énfasis. Allí Jesús habla a sus discípulos sobre los «pequeños» que están dentro de la comunidad; la oveja «se extravía» y la conclusión es que «no es la voluntad de su Padre que está en el cielo que se pierda ninguno de estos pequeños». Lucas aplica la parábola a los de afuera; Mateo, a los débiles de adentro. Juntos muestran que el Padre no se resigna a perder a nadie: ni al que nunca entró ni al que ya estaba entre nosotros."],luzNuevoPacto:["El antiguo pacto se apoyaba sobre ovejas que se apartaban. Jeremías 31:32 dice que Israel «invalidó» el pacto que Dios hizo con sus padres, pese a que Él era «su esposo». El nuevo pacto que Jeremías anuncia no repara la fidelidad de la oveja: cambia la base. «Yo les perdonaré su iniquidad, y nunca más me acordaré de sus pecados» (31:34). La promesa depende de quien la hace. Ezequiel 36:26-27 lo completa: «Les daré un corazón nuevo… infundiré mi espíritu en ustedes». Dios hace lo que la oveja no puede: busca, perdona y renueva.","La parábola calla el precio. Jesús cuenta la historia antes de la cruz, y no menciona lo que le costará al pastor. La carta a los Hebreos lo revela: Dios «resucitó de entre los muertos a nuestro Señor Jesús, el gran Pastor de las ovejas, por la sangre del pacto eterno» (Hebreos 13:20). El pastor de Lucas 15 deja las noventa y nueve; el Pastor de Juan 10 «da su vida por las ovejas». Lo que en la parábola es búsqueda, en la cruz es sustitución: Él cargó nuestros pecados «en su cuerpo sobre el madero» (1 Pedro 2:24), y por eso ahora las ovejas descarriadas han vuelto «al Pastor y Obispo de sus almas».","De ahí sale la seguridad del creyente. Bajo el nuevo pacto, la pregunta no es «¿me sostendré?», sino «¿quién me sostiene?». Jesús afirma: «Nadie las arrebatará de mi mano» (Juan 10:28), y Pablo cierra el argumento: nada «será capaz de separarnos del amor que Dios nos ha manifestado en Cristo Jesús» (Romanos 8:39). La oveja del hombro no tiene que agarrarse."],introduccion:["Todos hemos sentido, aunque sea una vez, el pánico de perder algo o a alguien: un niño que suelta tu mano en un centro comercial, una llave que no aparece, una persona que dejó de contestar el teléfono. En ese instante, lo demás deja de importar. Cambias de planes, dejas lo que tenías en las manos y sales a buscar. No calculas porcentajes; buscas.","Esa reacción es la que Jesús le atribuye a Dios, y la cuenta ante un público hostil. Los fariseos y maestros de la ley murmuraban porque Jesús recibía pecadores y comía con ellos. Su teología era clara: Dios espera, los pecadores deben cambiar y volver, y solo entonces habrá mesa. Jesús les cuenta una historia en la que el orden es exactamente el contrario: primero sale el Pastor. Esta noche vamos a mirar esa historia con calma, preguntándonos quién hace qué y qué significa, a la luz del nuevo pacto, que el Pastor tenga la iniciativa."],bosquejo:[{titulo:"Una queja que revela una teología",referencia:"Lucas 15:1-3; Ezequiel 34:1-16",desarrollo:"La murmuración de los fariseos no es un simple prejuicio social: es una manera de entender a Dios. Si Dios es un juez que espera desde lejos, entonces Jesús se equivoca al sentarse con los pecadores. Jesús no responde con un argumento sino con una imagen que ellos conocían bien: el pastor de Israel. Ezequiel 34 había acusado a los pastores que no buscaron a la perdida y había prometido que Dios mismo iría por ellas. Al contar la parábola, Jesús está diciendo: «Lo que ustedes critican en mí es lo que Dios prometió hacer». La queja se vuelve un espejo: quien critica al Pastor que busca se ubica, sin saberlo, entre los pastores que no buscaban. Toda predicación sobre esta parábola debe comenzar aquí: no es primero una orden para nosotros, sino un retrato de Dios.",versiculos:[{referencia:"Lucas 15:1-3",texto:"Muchos recaudadores de impuestos y pecadores se acercaban a Jesús para escucharlo. Los fariseos y los maestros de la ley murmuraban: «Este hombre recibe a los pecadores y come con ellos». Jesús entonces les contó esta parábola:"},{referencia:"Ezequiel 34:16",texto:"Buscaré a la oveja perdida, haré volver a la descarriada, vendaré a la herida y fortaleceré a la débil.",nota:"Verifica el texto en tu edición de la NVI antes de citarlo en público."}]},{titulo:"Una oveja que no sabe volver",referencia:"Lucas 15:4-6; Isaías 53:6",desarrollo:"Subraya los verbos de la parábola y verás quién trabaja. El pastor «deja», «va en busca», «encuentra», «carga», «vuelve», «reúne». La oveja solo está perdida y, después, cargada. Ni siquiera regresa caminando: viaja sobre los hombros, y eso significa que el pastor asume también el cansancio del camino de vuelta. La búsqueda es «hasta encontrarla»: no tiene plazo, no admite el cálculo de que ya no vale la pena. Y el pastor no la regaña en el camino; la lleva «muy contento». Isaías 53:6 nos coloca exactamente en el lugar de esa oveja: «Todos andábamos perdidos, como ovejas», y añade lo que el pastor hizo: el Señor hizo recaer sobre él la iniquidad de todos. La misma imagen que Jesús cuenta en un campo, Isaías la ve en una cruz.",versiculos:[{referencia:"Lucas 15:4-6",texto:"Supongamos que uno de ustedes tiene cien ovejas y pierde una de ellas. ¿No deja las noventa y nueve en el campo y va en busca de la oveja perdida hasta encontrarla? Y cuando la encuentra, muy contento la carga en los hombros y vuelve a la casa. Al llegar, reúne a sus amigos y vecinos, y les dice: “Alégrense conmigo; ya encontré la oveja que se me había perdido”."},{referencia:"Isaías 53:6",texto:"Todos andábamos perdidos, como ovejas; cada uno seguía su propio camino, pero el Señor hizo recaer sobre él la iniquidad de todos nosotros."}]},{titulo:"Lo que la parábola calla y la cruz revela: el precio",referencia:"Juan 10:11, 27-29; Hebreos 13:20-21; 1 Pedro 2:24-25",desarrollo:"Jesús cuenta la parábola antes de la cruz, y por eso no dice lo que la búsqueda costará. Nosotros sí lo sabemos. En Juan 10 Él se identifica con el buen pastor «que da su vida por las ovejas»; en Hebreos 13:20, el gran Pastor es levantado de entre los muertos «por la sangre del pacto eterno»; en 1 Pedro 2:24-25, las ovejas descarriadas vuelven al Pastor porque Él «llevó nuestros pecados en su cuerpo sobre la cruz». Aquí está la luz del nuevo pacto: el Pastor no solo deja las noventa y nueve; entrega su vida. Y de ahí nace la seguridad: si el precio ya se pagó, la oveja no está a prueba. Jesús dice: «Nadie las arrebatará de mi mano». La pregunta ya no es cuánto me sujeto, sino cuán firme es la mano que me sostiene.",versiculos:[{referencia:"Juan 10:11",texto:"Yo soy el buen pastor. El buen pastor da su vida por las ovejas."},{referencia:"Juan 10:27-29",texto:"Mis ovejas escuchan mi voz; yo las conozco y ellas me siguen. Yo les doy vida eterna, y nunca perecerán ni nadie las arrebatará de mi mano. Mi Padre, que me las ha dado, es más grande que todos; nadie las puede arrebatar de la mano de mi Padre."},{referencia:"Hebreos 13:20-21",texto:"Que el Dios de paz, que resucitó de entre los muertos a nuestro Señor Jesús, el gran Pastor de las ovejas, por la sangre del pacto eterno, los capacite en todo lo bueno para hacer su voluntad. Que, por medio de Jesucristo, Dios cumpla en nosotros lo que le agrada. A él sea la gloria por los siglos de los siglos. Amén."},{referencia:"1 Pedro 2:24-25",texto:"Él mismo, en su cuerpo, llevó al madero nuestros pecados, para que muramos al pecado y vivamos para la justicia. Por sus heridas ustedes han sido sanados. Antes eran ustedes como ovejas descarriadas, pero ahora han vuelto al Pastor y Obispo de sus almas."}]},{titulo:"El gozo que precede al sermón",referencia:"Lucas 15:5-7; Romanos 8:38-39",desarrollo:"Cuando el pastor encuentra a la oveja no le hace un examen: la pone en sus hombros «muy contento». Lo primero que aparece es gozo, y es un gozo tan grande que necesita compañía: reúne a amigos y vecinos. Es una imagen del corazón de Dios, y por eso Jesús concluye que así es en el cielo. Además, hay una ironía dirigida a los fariseos: «noventa y nueve justos que no necesitan arrepentirse». Jesús no dice que existan; describe cómo se ven a sí mismos los que murmuran. Romanos 3:23 los pondría en la misma oveja que el resto. Y hay una promesa final: a la oveja cargada nada la separa del amor que Dios ha manifestado en Cristo. El que fue encontrado no es un huésped a prueba: es alguien por quien hay fiesta.",versiculos:[{referencia:"Lucas 15:7",texto:"Les digo que así es también en el cielo: habrá más alegría por un solo pecador que se arrepienta, que por noventa y nueve justos que no necesitan arrepentirse."},{referencia:"Romanos 8:38-39",texto:"Pues estoy convencido de que ni la muerte ni la vida, ni los ángeles ni los demonios, ni lo presente ni lo por venir, ni los poderes, ni lo alto ni lo profundo, ni cosa alguna en toda la creación será capaz de separarnos del amor que Dios nos ha manifestado en Cristo Jesús nuestro Señor."}]}],aplicacion:["Lee Lucas 15:4-6 subrayando solo los verbos del pastor y encierra en un círculo los de la oveja. Habrá uno solo: «se había perdido». Cuando sientas que tu salvación depende de tu esfuerzo, vuelve a ese ejercicio.","Cambia la oración «Señor, no me sueltes» por «gracias, Señor, porque me tienes»: no niegues tu necesidad, pero apóyala en Juan 10:28-29, no en tu firmeza.","Si te sientes demasiado lejos para volver, recuerda que la oveja no vuelve: la cargan. Deja de ensayar un regreso y acepta ser encontrado.","Piensa en alguien que dejó de congregarse. ¿Qué haría el pastor de esta parábola? No es un juicio, es una pregunta: ¿una llamada, una visita, una mesa compartida esta semana?","Celebra en voz alta cuando alguien regrese. Convoca a otros, como el pastor: la alegría compartida es parte del evangelio."],cuidadoPastoral:"Esta parábola no dice que las noventa y nueve valgan menos ni que quien nunca se «perdió» de manera visible esté fuera del cuidado del Pastor. Tampoco enseña que el pecado sea inocuo porque el Pastor siempre irá detrás: la oveja que se aparta sufre daño real en el camino y el Pastor no es indiferente a eso. Cuidado también con dos extremos al hablar de seguridad: no la conviertas en licencia («si no me pueden arrebatar, hago lo que quiera») ni en angustia («¿y si no soy una de sus ovejas?»). Quien ama al Pastor y teme haberse perdido suele ser, precisamente, una oveja que oye su voz. Y con quien acompaña a un hijo, cónyuge o amigo que se fue, evita usar la parábola como reproche: el Pastor busca; no exige que otros lo imiten con culpa, sino con amor.",ilustracion:"Imagina un operativo de rescate en la montaña. Un excursionista se ha perdido en la niebla. El equipo no le pide que suba por su cuenta hasta el refugio para demostrar que merece ayuda, ni le hace un examen de por qué salió sin mapa. Sube, lo encuentra, lo carga si hace falta, y solo después, en el refugio, con una taza caliente, se pregunta qué ocurrió. Jesús cuenta la misma escena, con una diferencia: el Pastor no solo asume el riesgo de la montaña; dio su vida en ella.",conclusion:["Volvamos al comienzo: los fariseos murmuraban porque Jesús recibía pecadores. La parábola les responde y nos responde a nosotros: así es Dios. Un Pastor que deja lo seguro por lo perdido, que busca hasta encontrar, que carga en lugar de exigir y que hace fiesta en lugar de sermón. Y bajo el nuevo pacto sabemos algo más: cuánto le costó. La sangre del pacto eterno es el precio de la oveja que hoy descansa sobre sus hombros.","Si esta noche te reconoces como la oveja que se apartó, no ensayes un regreso: deja que te encuentre. Si te reconoces entre los noventa y nueve, pregúntate si tu corazón late con el del Pastor o con el de los que murmuran. Y si estás cansado de agarrarte, descansa: no eres tú quien sostiene, sino Él."],preguntasGrupo:["¿Con cuál de los dos grupos de Lucas 15:1-2 me identifico más hoy: los que se acercan o los que murmuran? ¿Por qué?","En la parábola, ¿qué hace la oveja? ¿Qué cambia en mi vida espiritual si acepto que mi papel es el de ser encontrado y sostenido?","¿Cómo se relacionan Juan 10:28-29 y Romanos 8:38-39 con la angustia de «¿y si me suelto?»? ¿Dónde vive esa angustia en mí?","¿Quién es hoy la «oveja perdida» en mi entorno (familia, trabajo, iglesia)? ¿Qué paso concreto de búsqueda puedo dar esta semana?","¿Cómo puede nuestra comunidad parecerse más a un pastor que busca que a los que murmuran?"]},{id:"la-moneda-que-no-perdio-su-valor",numero:44,serie:1,titulo:"La moneda que no perdió su valor",subtitulo:"Lo que vales lo decide quien te busca, no donde caíste",etiquetas:["Moneda perdida","Lucas 15","Identidad","Valor"],necesidades:["culpa","pasado","cansancio","miedo"],textoBase:{referencia:"Lucas 15:8-10",texto:"¿O qué mujer que tiene diez dracmas, si pierde una dracma, no enciende la lámpara, y barre la casa, y busca con diligencia hasta encontrarla? Y cuando la encuentra, reúne a sus amigas y vecinas, diciendo: Gozaos conmigo, porque he encontrado la dracma que había perdido. Así os digo que hay gozo delante de los ángeles de Dios por un pecador que se arrepiente.",version:"RVR1960"},textoBaseNVI:"O supongamos que una mujer tiene diez monedas de plata y pierde una. ¿No enciende una lámpara, barre la casa y busca con cuidado hasta encontrarla? Y cuando la encuentra, reúne a sus amigas y vecinas, y les dice: “Alégrense conmigo; ya encontré la moneda que se me había perdido”. Les digo que así mismo se alegran los ángeles de Dios por un solo pecador que se arrepiente.",textosApoyo:["Lucas 15:8-10","Isaías 43:1-4","Efesios 2:1-5","Efesios 5:8-14","1 Pedro 1:18-19","Juan 8:12","2 Corintios 4:6","Romanos 5:6-8","Jeremías 31:33-34"],ideaCentral:"La moneda no se pierde por decisión propia, no puede volver por sí misma y no pierde su valor por haber caído entre el polvo. Lo que la hace valiosa es quién la posee y cuánto está dispuesto a buscarla. Bajo el nuevo pacto, tu valor ante Dios no lo decide tu estado, tu historia ni tu desempeño, sino el precio que Él pagó —la sangre de Cristo— y la luz que Él mismo enciende para encontrarte. Perdida dentro de la casa, callada, sin drama: aun así buscada «con cuidado hasta encontrarla».",porQueNoConvencional:"De las tres parábolas de Lucas 15, esta es la más olvidada: no tiene el drama de un hijo con hambre ni de una oveja en el monte. Es una mujer, una casa oscura y una moneda de poco valor aparente. Precisamente por eso enseña algo que las otras dos no dicen con tanta claridad: que uno puede estar perdido dentro de la casa, sin ruido, sin que nadie lo note salvo quien lo posee, y que el valor de lo perdido no disminuye por el polvo. Este tema la lee como una parábola sobre identidad y sobre la luz, no solo sobre búsqueda.",contexto:["La escena transcurre en una casa de aldea galilea: pequeña, de piedra, con piso de tierra batida o de piedra irregular y una o dos ventanas estrechas. Dentro reina la penumbra incluso en pleno día, de modo que buscar algo pequeño en el suelo exige encender una lámpara de aceite. Barrer, además, era la única manera de encontrar una moneda hundida entre el polvo y las junturas del piso: la mujer remueve todo lo que hay.","La «dracma» era una moneda griega de plata de valor aproximado a un denario romano, es decir, más o menos el jornal de un día de trabajo (comparar con Mateo 20:2). Diez dracmas representaban unos diez días de sustento para una familia sencilla: no una fortuna, pero sí un capital modesto que podía significar la diferencia entre comer y no comer. Algunos estudiosos piensan en las monedas de un adorno nupcial, costumbre atestiguada en el Medio Oriente; el texto no lo dice, de modo que conviene presentarlo solo como posibilidad.","Lucas suele formar parejas de hombre y mujer (Zacarías y María, Simeón y Ana, el centurión y la viuda de Naín). Aquí, tras un pastor, Jesús escoge a una mujer como imagen de Dios que busca, en una sociedad donde las mujeres tenían poca voz pública. Con ello afirma, sin discursos, que la búsqueda de Dios reúne todo lo que hay de ternura y de tenacidad. Dios no queda reducido a una sola imagen.","La estructura de Lucas 15 es ascendente: se pierde una de cien (1 %), luego una de diez (10 %), luego uno de dos hijos (50 %). Cada pérdida es más cercana, más costosa. Y hay tres maneras de perderse: la oveja por andar errante, el hijo por decisión propia, la moneda por nada que el texto atribuya a ella. El texto tampoco dice cómo se perdió la moneda, porque no le interesa: fija toda la atención en la búsqueda. Finalmente, «delante de los ángeles de Dios» (v. 10) es probablemente una manera respetuosa de decir «en la presencia de Dios»: el gozo es de Dios mismo."],luzNuevoPacto:["El nuevo pacto responde a la pregunta que esta parábola despierta: ¿qué vale una vida manchada? Isaías 43:1-4, dirigido a un pueblo que ya había fallado, dice: «No temas, que yo te he redimido; te he llamado por tu nombre; tú eres mío… porque te amo y eres ante mis ojos precioso y digno de honra». El valor no viene del estado del pueblo, sino del Dios que redime y nombra. Jeremías 31:33-34 lo consolida: en el nuevo pacto Dios perdona y «nunca más» se acuerda de los pecados. El polvo no se convierte en argumento.","Pedro dice el precio con precisión: «Fueron rescatados… no con cosas perecederas, como el oro o la plata, sino con la preciosa sangre de Cristo» (1 Pedro 1:18-19). La mujer de la parábola pagó una búsqueda por una moneda de plata; Dios pagó la sangre de su Hijo por hijos que estaban «muertos en pecados» (Efesios 2:5). Lo que Dios pagó define lo que valemos para Él, y ese precio ya no cambia.","Y está la luz. La moneda nunca se habría encontrado sin la lámpara. Bajo el nuevo pacto, quien nos busca también es quien enciende la luz que nos hace verlo: «Yo soy la luz del mundo» (Juan 8:12); «Dios, que ordenó que la luz resplandeciera en las tinieblas, ha hecho brillar su luz en nuestro corazón» (2 Corintios 4:6); «Despierta, tú que duermes… y te alumbrará Cristo» (Efesios 5:14). La fe no es un logro de la moneda: es el efecto de haber sido alumbrada."],introduccion:["Un billete arrugado, pisado y tirado en el suelo sigue valiendo lo mismo que uno nuevo. Nadie lo duda cuando se trata de dinero; lo dudamos, en cambio, cuando se trata de nosotros. Después de un fracaso, una traición o una época oscura, muchos creyentes llevan una etiqueta escrita por dentro: «arruinado», «manchado», «de segunda». Y aunque asistan a la iglesia, se sienten perdidos entre los demás, sin que nadie lo note.","Jesús cuenta una parábola brevísima, casi olvidada entre las otras dos de Lucas 15, para hablar justamente de eso. No tiene drama de montaña ni de país lejano: transcurre en una casa oscura, con una mujer, una lámpara, una escoba y una moneda de plata. Y sin embargo dice algo que necesitamos oír: que quien te posee no te da por perdida, y que lo que vales no lo decide el polvo."],bosquejo:[{titulo:"Una casa oscura, una lámpara y una escoba",referencia:"Lucas 15:8-9",desarrollo:"Los verbos de la mujer son de una intensidad sorprendente para una moneda tan pequeña: enciende, barra, busca «con cuidado hasta encontrarla». Nadie le pide que lo haga; no hay un empleado, un vecino ni una regla que la obligue. La lámpara y la escoba son herramientas de una búsqueda sistemática: iluminar el lugar oscuro y remover lo que oculta. Y la búsqueda no termina hasta el hallazgo. Así es Dios con quienes se le pierden: no se resigna, no delega, no pone plazos. Y el valor de la moneda no se decide en la casa, sino en el corazón de la que la busca: por eso vale una búsqueda entera. Cuando una persona siente que Dios ya perdió el interés en ella, esta escena responde: la mujer sigue barriendo.",versiculos:[{referencia:"Lucas 15:8-9",texto:"O supongamos que una mujer tiene diez monedas de plata y pierde una. ¿No enciende una lámpara, barre la casa y busca con cuidado hasta encontrarla? Y cuando la encuentra, reúne a sus amigas y vecinas, y les dice: “Alégrense conmigo; ya encontré la moneda que se me había perdido”."}]},{titulo:"Perdida dentro de la casa",referencia:"Lucas 15:8; Efesios 2:1-5",desarrollo:"La moneda no se perdió en un país lejano ni en el desierto: se perdió dentro de la casa. Se puede estar cerca del pueblo de Dios, sentarse cada domingo en la misma banca, hablar el lenguaje de la fe, y aun así estar perdido, sin ruido y sin que nadie lo note. Esa es la sutileza de esta parábola: incluye a los perdidos silenciosos. Además, la moneda es completamente pasiva: no puede arrepentirse, no puede buscar, no puede volver. Todo lo hace la mujer. Pablo describe la misma condición con una palabra fuerte: «muertos en pecados». Y a continuación, la frase que cambia todo: «Pero Dios, que es rico en misericordia, por el gran amor con que nos amó, nos dio vida con Cristo». La iniciativa es de Dios; la moneda es hallada.",versiculos:[{referencia:"Efesios 2:1",texto:"En cuanto a ustedes, estaban muertos en sus transgresiones y pecados."},{referencia:"Efesios 2:4-5",texto:"Pero Dios, que es rico en misericordia, por el gran amor con que nos amó, nos dio vida con Cristo, aun cuando estábamos muertos en pecados. ¡Por gracia ustedes han sido salvados!"}]},{titulo:"Valiosa en el polvo: lo que pagó el Dueño",referencia:"Isaías 43:1-4; 1 Pedro 1:18-19; Romanos 5:6-8",desarrollo:"El polvo no le quita valor a una moneda. Sigue siendo una dracma esté limpia o cubierta de tierra. Jesús no dice que la moneda se limpió antes de ser valiosa: dice que valía antes de ser hallada. Eso responde a una de las mentiras más comunes del corazón cansado: «Cuando me arregle, entonces Dios me querrá». Isaías 43 se dirige a un pueblo que había fallado y lo llama «precioso y digno de honra» antes de que cambie. Romanos 5:8 añade que Dios «demuestra su amor por nosotros en esto: en que cuando todavía éramos pecadores, Cristo murió por nosotros». Y Pedro ofrece el precio exacto: no oro ni plata, sino la sangre preciosa de Cristo. Una moneda le costó a la mujer una búsqueda; nosotros le costamos a Dios la vida de su Hijo. Ese es nuestro valor: no lo que hemos sido, sino lo que Él pagó.",versiculos:[{referencia:"Isaías 43:1",texto:"Pero ahora, así dice el Señor, el que te creó, Jacob, el que te formó, Israel: «No temas, que yo te he redimido; te he llamado por tu nombre; tú eres mío»."},{referencia:"Romanos 5:8",texto:"Pero Dios demuestra su amor por nosotros en esto: en que cuando todavía éramos pecadores, Cristo murió por nosotros."},{referencia:"1 Pedro 1:18-19",texto:"Como bien saben, ustedes fueron rescatados de la vida absurda que heredaron de sus antepasados. El precio de su rescate no se pagó con cosas perecederas, como el oro o la plata, sino con la preciosa sangre de Cristo, el cordero sin mancha y sin defecto."}]},{titulo:"La luz que encendió la casa y la fiesta que sigue",referencia:"Lucas 15:9-10; Juan 8:12; 2 Corintios 4:6; Efesios 5:14",desarrollo:"Sin lámpara, la moneda jamás se habría visto. La luz no la produjo ella: la trajo la que busca. Jesús dijo: «Yo soy la luz del mundo», y Pablo explica cómo actúa: el mismo Dios que dijo «que brille la luz» en la creación hace brillar su luz en el corazón del que estaba a oscuras. Efesios 5:14 recoge una exhortación temprana de la Iglesia que une luz y vida: «Despierta, tú que duermes, levántate de entre los muertos, y te alumbrará Cristo». La conversión, entonces, no es un logro sino un amanecer. Y al final llega la fiesta: la mujer no se guarda la alegría, la comparte con amigas y vecinas, y Jesús añade que hay gozo en la presencia de Dios. La Iglesia existe, entre otras cosas, para celebrar hallazgos. Y a diferencia del hermano mayor de la tercera parábola, la única respuesta correcta a esta invitación es entrar.",versiculos:[{referencia:"Juan 8:12",texto:"Una vez más Jesús se dirigió a la gente y les dijo: —Yo soy la luz del mundo. El que me sigue nunca andará en la oscuridad, sino que tendrá la luz de la vida."},{referencia:"2 Corintios 4:6",texto:"Porque Dios, que ordenó que la luz resplandeciera en las tinieblas, ha hecho brillar su luz en nuestro corazón para darnos el conocimiento de la gloria de Dios que resplandece en el rostro de Cristo."},{referencia:"Lucas 15:10",texto:"Les digo que así mismo se alegran los ángeles de Dios por un solo pecador que se arrepiente."}]}],aplicacion:["Escribe en una hoja las etiquetas que te has puesto por lo que pasó («arruinado», «sucio», «de segunda»). Debajo escribe: «Valgo lo que Dios pagó», y lee en voz alta 1 Pedro 1:18-19.","Si te sientes perdido dentro de la iglesia, invisible entre muchos, recuerda que la moneda se pierde dentro de la casa: no estás fuera del radio de la búsqueda. Dile a alguien de confianza cómo estás realmente.","Si tienes un cargo, no consideres «casos menores» a los perdidos silenciosos —los que no dan problemas, simplemente dejaron de venir—. La mujer barrió toda la casa por una sola moneda.","Enciende la lámpara: dedica un tiempo fijo esta semana a la Palabra, la oración y una conversación honesta. La luz no la produces tú, pero puedes quedarte cerca de donde brilla.","Celebra un hallazgo: cuando alguien de tu círculo vuelva a Dios o se reconcilie con Él, cuéntalo, agradécelo, haz mesa. La alegría compartida es parte del evangelio."],cuidadoPastoral:"Hay una lectura muy popular que ve en la moneda la «imagen de Dios» impresa en el ser humano (Génesis 1:26-27). Es una aplicación devocional válida, pero no un dato del texto, y conviene presentarla como tal. Tampoco debe entenderse que todo asistente a una iglesia es un perdido: la parábola no acusa; describe el cuidado de quien busca. Con quien sufre una identidad herida por abuso, abandono o fracaso, no repitas «vales mucho» como eslogan: esa afirmación solo consuela cuando se oye dentro de una presencia concreta y paciente. Y evita convertir la parábola en un método («déjate encontrar»): la moneda no hace nada para ser hallada, y la fe que sigue al hallazgo es también obra de la luz.",ilustracion:"Se cuenta a menudo la escena de un orador que muestra un billete de veinte dólares, lo arruga, lo tira al suelo, lo pisa y lo levanta, y pregunta quién lo quiere. Todos levantan la mano: arrugado y sucio sigue valiendo lo mismo. Es una ilustración conocida y sencilla, y sirve para captar la idea central: el valor de la moneda no está en su estado, sino en quien la reclama. Lucas 15:8-10 añade lo que la ilustración no alcanza a decir: alguien enciende la lámpara y sale a buscarla.",conclusion:["Volvamos a la casa oscura. Hay una mujer con una lámpara, una escoba y una moneda perdida. No hay drama, no hay discurso. Hay una búsqueda que no se detiene y un hallazgo que termina en fiesta. Así te busca Dios, aunque te sientas invisible, aunque nadie lo haya notado, aunque llevas años sentado en la misma banca sin que nadie sepa que estás perdido por dentro.","Y no fue una búsqueda barata. A la luz del nuevo pacto sabemos cuánto valías para Él: la sangre de su Hijo. Esa es tu tasación, y no cambia con tu estado de ánimo, con tu historia ni con el polvo que traigas encima. Si esta noche alguien te encuentra la mirada y te dice «alégrate conmigo», no la esquives: entra a la fiesta."],preguntasGrupo:["¿Qué etiquetas cargo por mi pasado o por mis fracasos? ¿Cómo las confronta Isaías 43:1-4 y 1 Pedro 1:18-19?","La moneda se pierde dentro de la casa. ¿Cómo se puede estar perdido siendo parte de una iglesia? ¿Cómo podemos notarlo en otros?","¿Qué significa que la moneda no hace nada y que la luz la trae la mujer? ¿Qué cambia en cómo entiendo la fe y el arrepentimiento?","¿Qué relación hay entre la lámpara de la parábola y Juan 8:12, 2 Corintios 4:6 y Efesios 5:14?","¿Cuándo fue la última vez que celebramos como comunidad el regreso de alguien? ¿Qué podríamos hacer para que sea más frecuente?"]},{id:"la-moneda-encontrada",numero:46,serie:1,titulo:"La moneda encontrada",subtitulo:"Comienza con Dios buscando al perdido",etiquetas:["Moneda perdida","Lucas 15","Buena noticia","Reconciliación"],necesidades:["culpa","pasado","legalismo"],textoBase:{referencia:"Lucas 15:8-10",texto:"¿O qué mujer que tiene diez dracmas, si pierde una dracma, no enciende la lámpara, y barre la casa, y busca con diligencia hasta encontrarla? Y cuando la encuentra, reúne a las amigas y vecinas, diciendo: Gozaos conmigo, porque he encontrado la dracma que había perdido. Así os digo que hay gozo delante de los ángeles de Dios por un pecador que se arrepiente.",version:"RVR1960"},textoBaseNVI:"O supongamos que una mujer tiene diez monedas de plata y pierde una. ¿No enciende una lámpara, barre la casa y busca con cuidado hasta encontrarla? Y, cuando la encuentra, reúne a las amigas y vecinas, y les dice: 'Alégrense conmigo; ya encontré la moneda que se me había perdido'. Les digo que así mismo se alegra Dios con sus ángeles por un pecador que se arrepiente.",textosApoyo:["Lucas 15:1-2","Lucas 19:10","Génesis 1:27","Juan 1:9","Ezequiel 34:16","Romanos 2:4","2 Corintios 5:17-18"],ideaCentral:"Dios sale a buscar al perdido porque nunca dejó de valer para Él. Asumir la vida en Cristo es vivir como alguien que ya fue encontrado y unirse a esa búsqueda.",porQueNoConvencional:"",titulos:{introduccion:"Buena noticia",preguntas:"Preguntas de reflexión",conclusion:"Cierre"},introduccion:["«Porque el Hijo del hombre vino a buscar y a salvar lo que se había perdido.» (Lucas 19:10 NVI)","La buena noticia no comienza con el perdido buscando a Dios. Comienza con Dios buscando al perdido."],contexto:["Jesús está comiendo con publicanos y pecadores, y los fariseos murmuran:","«Muchos recaudadores de impuestos y pecadores se acercaban a Jesús para oírlo, de modo que los fariseos y los maestros de la ley se pusieron a murmurar: “Este hombre recibe a los pecadores y come con ellos”.» (Lucas 15:1-2 NVI)","Entonces Jesús cuenta tres historias: una oveja perdida, una moneda perdida, un hijo perdido.","En las tres aparece el mismo movimiento: PÉRDIDA - BÚSQUEDA - ENCUENTRO - CELEBRACIÓN","El problema de los fariseos era que les molestaba lo mismo que a Dios le daba alegría."],bosquejo:[{titulo:"Perdida, pero valiosa",referencia:"Génesis 1:27",desarrollo:"El que está lejos de Dios no ha dejado de valer para Él.",versiculos:[{referencia:"Génesis 1:27",texto:"Y Dios creó al ser humano a su imagen; lo creó a imagen de Dios. Hombre y mujer los creó."}],estructura:[{etiqueta:"Explicación",texto:"La moneda estaba en el suelo, pero seguía siendo moneda. Su valor no dependía del lugar donde había caído. Lo mismo pasa con el pecador: el pecado lo aleja y lo desordena, pero no borra la imagen de Dios que lleva."},{etiqueta:"Cristo",texto:"Cristo es la imagen perfecta de Dios. Vino a buscar y a restaurar en el ser humano lo que el pecado cubrió de polvo."},{etiqueta:"Asumir",texto:"Tú también fuiste esa moneda. Dios te valoró antes de que lo conocieras, y en Cristo fuiste hallado y restaurado. Eso cambia la manera en que miras a los que todavía están lejos."},{etiqueta:"Aplicación",texto:"No veas a la persona alejada de Dios como un caso perdido. Mírala como alguien a quien Dios está buscando."},{etiqueta:"Frase clave",texto:"«Perderse describe dónde estaba la moneda, no cuánto valía.»"}]},{titulo:"Dios enciende la lámpara",referencia:"Juan 1:9",desarrollo:"La salvación empieza con Dios alumbrando, no con nosotros encontrando el camino.",versiculos:[{referencia:"Juan 1:9",texto:"Esa luz verdadera, la que alumbra a todo ser humano, venía a este mundo."}],estructura:[{etiqueta:"Explicación",texto:"Las casas de entonces eran oscuras, con pocas ventanas y piso de tierra o piedra. Sin luz no se encontraba nada. La mujer no espera a que amanezca: prende la lámpara."},{etiqueta:"Cristo",texto:"Jesús es la luz que entró en nuestra oscuridad. La encarnación es Dios prendiendo la lámpara dentro de la casa."},{etiqueta:"Asumir",texto:"No tuviste que buscar a Dios a tientas. Él alumbró primero y te alcanzó."},{etiqueta:"Aplicación",texto:"Descansa en eso. Tu relación con Dios no nace de tu esfuerzo por hallarlo, sino de que Él te halló."},{etiqueta:"Frase clave",texto:"«No fuimos nosotros los que prendimos la luz.»"}]},{titulo:"Busca hasta encontrar",referencia:"Ezequiel 34:16",desarrollo:"La búsqueda de Dios no tiene horario ni límite: es «hasta encontrarla».",versiculos:[{referencia:"Ezequiel 34:16",texto:"Buscaré a las ovejas perdidas, recogeré a las extraviadas, vendaré a las que estén heridas y fortaleceré a las débiles…"}],estructura:[{etiqueta:"Explicación",texto:"La mujer barre, mueve y revisa cada rincón. No busca un rato. Desde Ezequiel, Dios había prometido que Él mismo buscaría a los suyos."},{etiqueta:"Cristo",texto:"Jesús cumple esa promesa. Lucas 19:10, que leímos al principio, lo dice en la casa de Zaqueo: la promesa de Ezequiel tiene nombre y rostro."},{etiqueta:"Asumir",texto:"Ya fuiste encontrado. No vives para que Dios te halle; vives como alguien a quien Él ya halló."},{etiqueta:"Aplicación",texto:"No te rindas con esa persona que crees que «ya no tiene arreglo». Dios no se rindió contigo."},{etiqueta:"Frase clave",texto:"«Dios no tiene una lista de casos perdidos.»"}]},{titulo:"Arrepentirse es dejarse encontrar",referencia:"Romanos 2:4",desarrollo:"El arrepentimiento es fruto de la bondad de Dios, no el precio para conseguirla.",versiculos:[{referencia:"Romanos 2:4",texto:"¿No ves que desprecias las riquezas de la bondad de Dios, de su tolerancia y de su paciencia, al no reconocer que su bondad quiere llevarte al arrepentimiento?"}],estructura:[{etiqueta:"Explicación",texto:"La moneda no hizo nada para ser hallada. Aun así, Jesús llama a eso «un pecador que se arrepiente». Arrepentirse es responder a Aquel que ya vino a buscarnos."},{etiqueta:"Cristo",texto:"En la cruz, Dios no esperó a que cambiáramos. Cristo murió por nosotros cuando todavía éramos pecadores. Esa bondad es la que hace volver al perdido."},{etiqueta:"Asumir",texto:"Tu vida en Cristo empezó porque Él te buscó, no porque tú lo convenciste. Lo que tienes, lo tienes por gracia."},{etiqueta:"Aplicación",texto:"Cuando compartas el evangelio, no presentes a un Dios al que hay que convencer. Presenta al Dios que ya salió a buscar."},{etiqueta:"Frase clave",texto:"«El cielo hace fiesta por lo que los religiosos critican.»"}]},{titulo:"Alégrense conmigo",referencia:"2 Corintios 5:17-18",desarrollo:"Dios invita a su iglesia a su alegría y a su búsqueda.",versiculos:[{referencia:"2 Corintios 5:17-18",texto:"Por lo tanto, si alguno está en Cristo, es una nueva creación. ¡Lo viejo ha pasado, ha llegado ya lo nuevo! Todo esto proviene de Dios, quien por medio de Cristo nos reconcilió consigo mismo y nos dio el ministerio de la reconciliación."}],estructura:[{etiqueta:"Explicación",texto:"La mujer no celebra sola: llama a las amigas y a las vecinas. Los fariseos murmuran (15:2) y el cielo celebra (15:10). Los dos estaban mirando a la misma gente."},{etiqueta:"Cristo",texto:"Por medio de Cristo fuimos reconciliados, y Él mismo nos hace parte de su obra de reconciliación."},{etiqueta:"Asumir",texto:"Eres nueva creación y colaborador del que busca. No eres el portero que decide quién entra."},{etiqueta:"Aplicación",texto:"Esta semana piensa en una persona alejada de Dios. Ora por ella, búscala y siéntate a la mesa con ella."},{etiqueta:"Frase clave",texto:"«Si nos molesta lo que alegra al cielo, algo no anda bien en nuestro corazón.»"}]}],aplicacion:[],cuidadoPastoral:"",ilustracion:"",conclusion:["Guía una oración: «Señor, gracias por prender la luz y buscarme hasta encontrarme. Dame tus ojos para ver a los que todavía están lejos, y tu alegría cuando vuelven a casa.»"],preguntasGrupo:["¿Miro a los que están lejos de Dios como Él los mira?","¿Quién es esa «moneda perdida» que yo ya dejé de buscar?","¿Mi iglesia se parece más a Lucas 15:2 o a Lucas 15:10?"]}],Iv=[{id:"la-parabola-del-hijo-prodigo",numero:45,serie:1,titulo:"La parábola del Hijo Pródigo",subtitulo:"",etiquetas:["Hijo pródigo","Lucas 15","Imitar al Padre"],necesidades:["culpa","legalismo","relaciones"],textoBase:{referencia:"Lucas 15:11-32",texto:"También dijo: Un hombre tenía dos hijos; 12 y el menor de ellos dijo a su padre: Padre, dame la parte de los bienes que me corresponde; y les repartió los bienes. 13 No muchos días después, juntándolo todo el hijo menor, se fue lejos a una provincia apartada; y allí desperdició sus bienes viviendo perdidamente. 14 Y cuando todo lo hubo malgastado, vino una gran hambre en aquella provincia, y comenzó a faltarle. 15 Y fue y se arrimó a uno de los ciudadanos de aquella tierra, el cual le envió a su hacienda para que apacentase cerdos. 16 Y deseaba llenar su vientre de las algarrobas que comían los cerdos, pero nadie le daba. 17 Y volviendo en sí, dijo: ¡Cuántos jornaleros en casa de mi padre tienen abundancia de pan, y yo aquí perezco de hambre! 18 Me levantaré e iré a mi padre, y le diré: Padre, he pecado contra el cielo y contra ti. 19 Ya no soy digno de ser llamado tu hijo; hazme como a uno de tus jornaleros. 20 Y levantándose, vino a su padre. Y cuando aún estaba lejos, lo vio su padre, y fue movido a misericordia, y corrió, y se echó sobre su cuello, y le besó. 21 Y el hijo le dijo: Padre, he pecado contra el cielo y contra ti, y ya no soy digno de ser llamado tu hijo. 22 Pero el padre dijo a sus siervos: Sacad el mejor vestido, y vestidle; y poned un anillo en su mano, y calzado en sus pies. 23 Y traed el becerro gordo y matadlo, y comamos y hagamos fiesta; 24 porque este mi hijo muerto era, y ha revivido; se había perdido, y es hallado. Y comenzaron a regocijarse. 25 Y su hijo mayor estaba en el campo; y cuando vino, y llegó cerca de la casa, oyó la música y las danzas; 26 y llamando a uno de los criados, le preguntó qué era aquello. 27 Él le dijo: Tu hermano ha venido; y tu padre ha hecho matar el becerro gordo, por haberle recibido bueno y sano. 28 Entonces se enojó, y no quería entrar. Salió por tanto su padre, y le rogaba que entrase. 29 Mas él, respondiendo, dijo al padre: He aquí, tantos años te sirvo, no habiéndote desobedecido jamás, y nunca me has dado ni un cabrito para gozarme con mis amigos. 30 Pero cuando vino este tu hijo, que ha consumido tus bienes con rameras, has hecho matar para él el becerro gordo. 31 Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas. 32 Mas era necesario hacer fiesta y regocijarnos, porque este tu hermano era muerto, y ha revivido; se había perdido, y es hallado.",version:"RVR1960"},textosApoyo:["Efesios 2:4-5","Lucas 15:11-32"],ideaCentral:"",porQueNoConvencional:"",tituloBosquejo:"7 verdades reveladoras de esta parábola",titulos:{conclusion:"Conclusión"},buenaNoticia:["Efesios 2:4-5","«Pero Dios, que es rico en misericordia, por su gran amor con que nos amó, aun estando nosotros muertos en pecados, nos dio vida juntamente con Cristo (por gracia sois salvos).»"],introduccion:["La parábola del Hijo Pródigo no es solo una de las historias más conocidas de Jesús, es también una de las más profundas y transformadoras. En ella, Jesús no solo habla del pecado y el perdón, sino que revela con claridad el corazón del Padre.","Más allá del hijo menor que se aleja y del hijo mayor que se resiente, esta parábola nos invita a vernos en el espejo de sus personajes y, sobre todo, a caminar hacia la meta de parecernos al Padre.","Aquí somos confrontados por una gracia que no tiene medida, por un amor que no espera perfección, y por un Reino donde el gozo del Padre rompe todas las expectativas religiosas"],bosquejo:[{titulo:"La gracia siempre va antes que la confesión",referencia:"Lucas 15:20-22",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Lucas 15:20-22",version:"RVR1960",texto:"Y levantándose, vino a su padre. Y cuando aún estaba lejos, lo vio su padre, y fue movido a misericordia, y corrió, y se echó sobre su cuello, y le besó. Y el hijo le dijo: Padre, he pecado contra el cielo y contra ti, y ya no soy digno de ser llamado tu hijo."},{tipo:"lista",items:[{texto:"El hijo menor regresa a casa con un discurso de arrepentimiento, pero el Padre no lo deja terminar. Lo abraza antes, lo restaura antes, lo celebra antes."},{texto:"Esta escena revela el corazón de Dios: no espera perfección en nuestra confesión.",sub:["Su gracia se adelanta.","El perdón comienza en el amor del Padre, más que en la explicación del pecador."]}]}]},{titulo:"Dios no se avergüenza de restaurar públicamente",referencia:"Lucas 15:20-24",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Lucas 15:20-24",version:"RVR1960",texto:"Pero el padre dijo a sus siervos: Sacad el mejor vestido, y vestidle; y poned un anillo en su mano, y calzado en sus pies."},{tipo:"lista",items:[{texto:"El Padre corre en público, expone su dignidad social para cubrir la vergüenza del hijo."},{texto:"No lo lleva al rincón para reprenderlo en privado; lo restaura a la vista de todos."},{texto:"Este acto revela que Dios no esconde Su gracia.",sub:["La muestra.","La celebra.","La derrama sin temor a la opinión pública."]}]}]},{titulo:"Puedes estar en la casa del Padre y no conocer su corazón",referencia:"Lucas 15:25-29",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Lucas 15:25-29",version:"RVR1960",texto:"Y su hijo mayor estaba en el campo; y cuando vino, y llegó cerca de la casa, oyó la música y las danzas; y llamando a uno de los criados, le preguntó qué era aquello. Él le dijo: Tu hermano ha venido; y tu padre ha hecho matar el becerro gordo, por haberle recibido bueno y sano. Entonces se enojó, y no quería entrar. Salió por tanto su padre, y le rogaba que entrase."},{tipo:"lista",items:[{texto:"El hijo mayor representa al creyente que obedece, pero no disfruta."},{texto:"Que sirve, pero no se siente amado."},{texto:"Nunca se fue, pero tampoco entró a la fiesta."},{texto:"Esta parte de la parábola confronta a los que han estado cerca físicamente, pero lejos emocionalmente."},{texto:"La intimidad con Dios no se mide por actividad, sino por comunión."}]}]},{titulo:"La gracia ofende al que vive por mérito",referencia:"Lucas 15:29-31",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Lucas 15:29-31",version:"RVR1960",texto:"Mas él, respondiendo, dijo al padre: He aquí, tantos años te sirvo, no habiéndote desobedecido jamás, y nunca me has dado ni un cabrito para gozarme con mis amigos. Pero cuando vino este tu hijo, que ha consumido tus bienes con rameras, has hecho matar para él el becerro gordo. Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas."},{tipo:"lista",items:[{texto:"El hijo mayor no se molesta por la restauración del hermano, sino por la misericordia y la gracia del Padre."},{texto:"Para quien basa su identidad en lo que hace, la gracia siempre parecerá injusta. Pero en el Reino de Dios, nadie recibe por mérito.",sub:["Todo es don.","Todo es gracia.","Y el que la entiende, se alegra cuando otros también la reciben."]}]}]},{titulo:"El pecado no siempre es la rebeldía abierta, muchas veces es dureza del corazón",referencia:"Lucas 15:11-32",desarrollo:"",bloques:[{tipo:"lista",items:[{texto:"El hijo menor pecó contra el Padre."},{texto:"El mayor, contra su corazón."},{texto:"Uno volvió quebrantado, el otro se quedó endurecido."},{texto:"Jesús deja el final abierto: no sabemos si el hijo mayor entró."},{texto:"Porque ese es el punto.",sub:["A veces, el corazón frío y correcto está más lejos que el que se humilló y volvió."]}]}]},{titulo:"Celebrar el perdón ajeno es evidencia de ser conscientes del perdón propio",referencia:"Lucas 15:27-28, 31-32",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Lucas 15:27-28, 31-32",version:"RVR1960",texto:"Él le dijo: Tu hermano ha venido; y tu padre ha hecho matar el becerro gordo, por haberle recibido bueno y sano. Entonces se enojó, y no quería entrar."},{tipo:"versiculo",referencia:"Lucas 15:27-28, 31-32",version:"RVR1960",texto:"Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas. Mas era necesario hacer fiesta y regocijarnos, porque este tu hermano era muerto, y ha revivido; se había perdido, y es hallado."},{tipo:"lista",items:[{texto:"Una prueba de que hemos recibido gracia es cuánto celebramos cuando toca a otros."},{texto:"El hijo mayor no pudo alegrarse. Y eso revela que su identidad no descansaba en el amor del Padre, sino en su propio rendimiento."},{texto:"Quien ha sido perdonado, celebra cada perdón como si fuera suyo."}]}]},{titulo:"Imitar al Padre es la meta",referencia:"Lucas 15:11-32",desarrollo:"",bloques:[{tipo:"lista",items:[{texto:"La parábola no nos llama solo a identificar qué hijo somos."},{texto:"Nos llama a parecernos al Padre."},{texto:"Él es quien ama incondicionalmente, corre sin reservas, restaura con honor y suplica con ternura."},{texto:"Madurar en Cristo es llegar a reflejar ese carácter: no solo volver a casa, sino salir a recibir."}]}]}],aplicacion:[],cuidadoPastoral:"",ilustracion:"",conclusion:["La parábola del Hijo Pródigo nos deja con una puerta abierta. No sabemos si el hijo mayor entra a la fiesta. Y esa es precisamente la intención de Jesús: Él no termina la historia, porque quiere que tú y yo la continuemos.","Cada uno de nosotros, en algún momento, ha sido el hijo que se fue o el que se quedó.","Pero la meta no es quedarnos ahí. La verdadera madurez del Reino es convertirnos en reflejos del Padre: abrazar sin condiciones, restaurar con honra, y celebrar con libertad cuando alguien regresa a casa. Que esta guía no sea solo un ejercicio intelectual, sino un llamado espiritual. Que despierte en ti el deseo de conocer más al Padre, imitar su corazón y vivir como hijo en una casa donde siempre hay lugar para uno más..."]}],$v=[{id:"puedo-descansar-sin-entenderlo-todo",numero:47,serie:1,titulo:"Puedo descansar sin entenderlo todo",subtitulo:"",etiquetas:["Salmo 131","Descanso","Preguntas sin respuesta"],necesidades:["cansancio","ansiedad"],textoBase:{referencia:"Salmo 131:1-3",texto:"Señor, mi corazón no es soberbio, ni mis ojos altivos; no ando tras las grandezas, ni en cosas demasiado difíciles para mí. Sino que he calmado y acallado mi alma; como un niño destetado en el regazo de su madre, como un niño destetado está mi alma dentro de mí. Espera, oh Israel, en el Señor, desde ahora y para siempre.",version:"NBLA"},textosApoyo:["Efesios 2:18","Mateo 11:28","Juan 19:30"],ideaCentral:"",porQueNoConvencional:"",titulos:{introduccion:"Buena noticia",conclusion:"Antes de cerrar"},introduccion:["«Pues por medio de él tenemos acceso al Padre por un mismo Espíritu». (Efesios 2:18, NVI)","Hay cosas que todavía no entiendo. Algunas las sigo buscando; otras ni siquiera sé cómo preguntarlas. Y aun así, Cristo ya abrió el camino para llegar al Padre con todo eso.","Mire a un niño ya destetado. Ya no busca el pecho para saciarse. Si sigue cerca de su mamá, es porque quiere estar con ella. No por la comida, sino por la relación.","Hay un salmo corto que habla justo de eso. Lo leemos por partes."],bosquejo:[{titulo:"Reconocer mis límites",referencia:"Salmo 131:1",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Salmo 131:1",version:"NBLA",texto:"Señor, mi corazón no es soberbio, ni mis ojos altivos; no ando tras las grandezas, ni en cosas demasiado difíciles para mí"},{tipo:"texto",texto:"A mí me cuesta admitirlo. Quiero entender para sentirme tranquilo. Si tengo la explicación, siento que tengo algo bajo control. Y muchas veces no la hay."},{tipo:"texto",texto:"A veces me sorprendo explicando de más. Le busco razón a todo: a lo que me pasa, a lo que le pasa a otro, a un error mío. Cuando me equivoco, lo primero que hago no es reconocer el fallo, sino buscarle propósito. Así me quedo tranquilo sin tener que descansar."},{tipo:"texto",texto:"El salmo no me pide que entienda mi error. Me pide que lo reconozca y me quede quieto en la presencia de Dios."}]},{titulo:"Acercarme sin forzar nada",referencia:"Salmo 131:2",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Salmo 131:2",version:"NBLA",texto:"Sino que he calmado y acallado mi alma; como un niño destetado en el regazo de su madre, como un niño destetado está mi alma dentro de mí"},{tipo:"texto",texto:"Así me imagino a David diciéndolo: un hombre con muchas preguntas que, en algún momento, dejó de pelear con ellas delante de Dios. Fíjese en lo que no dice. No dice que ya entendió. Dice que está cerca de su madre, sin pedir nada a cambio. Lo quiere así, sin forzarse."},{tipo:"texto",texto:"Jesús lo dijo de otra forma: «Vengan a mí todos ustedes que están cansados y agobiados, y yo les daré descanso». (Mateo 11:28, NVI)"},{tipo:"texto",texto:"No dijo: vengan cuando ya lo entiendan. Dijo: vengan cansados, con la cabeza llena y sin saber qué hacer con lo que les pasa."},{tipo:"texto",texto:"Todavía no sé aquietar del todo mi alma. Voy llevándole lo que no logro calmar, aunque se lo lleve en desorden."}]},{titulo:"Esperar en Dios, no en las respuestas",referencia:"Salmo 131:3",desarrollo:"",bloques:[{tipo:"versiculo",referencia:"Salmo 131:3",version:"NBLA",texto:"Espera, oh Israel, en el Señor, desde ahora y para siempre"},{tipo:"texto",texto:"Fíjese en a quién le habla David. No se lo dice a su alma sola. Se lo dice a Israel, al pueblo entero, y les pide que pongan la esperanza en el Señor, no en lo que alcancen a entender."},{tipo:"texto",texto:"Yo sigo poniendo muchas veces la esperanza en la respuesta. Si entiendo, estoy tranquilo. Y todavía estoy aprendiendo a dejarla donde corresponde."},{tipo:"texto",texto:"David lo dijo a Israel. Cristo lo hizo posible para la iglesia. Por eso no esperamos solos, sino juntos, cada uno con su pregunta a cuestas."},{tipo:"texto",texto:"Yo no estoy en el final de este camino. Todavía estoy en medio. Pero la obra que me sostiene no depende de mi avance: Cristo terminó lo que tenía que terminar, como lo dejó dicho en la cruz: «Consumado es» (Juan 19:30). Lo que me toca hoy es quedarme cerca, sin esconderme de lo que siento, mientras aprendo a descansar en eso."}]}],aplicacion:[],cuidadoPastoral:"",ilustracion:"",conclusion:["¿Qué pregunta lleva usted desde hace tiempo y todavía no se ha atrevido a llevarla al Padre tal como está?","El próximo domingo: qué hacer con la pregunta cuando la respuesta sigue sin llegar."]}],Fv=[{id:"las-diez-virgenes",numero:48,serie:1,titulo:"Las diez vírgenes",subtitulo:"",etiquetas:["Diez vírgenes","Mateo 25","Parábolas de Jesús","Seguridad"],necesidades:["miedo","legalismo","culpa"],textoBase:{referencia:"Mateo 25:1-13",texto:"El reino de los cielos será entonces como diez jóvenes solteras que tomaron sus lámparas y salieron a recibir al novio. 2 Cinco de ellas eran insensatas y cinco, prudentes. 3 Las insensatas llevaron sus lámparas, pero no se abastecieron de aceite. 4 En cambio, las prudentes llevaron vasijas de aceite junto con sus lámparas. 5 Y como el novio tardaba en llegar, a todas les dio sueño y se durmieron. 6 A medianoche se oyó un grito: “¡Ahí viene el novio! ¡Salgan a recibirlo!”. 7 Entonces todas las jóvenes se despertaron y se pusieron a preparar sus lámparas. 8 Las insensatas dijeron a las prudentes: “Dennos un poco de su aceite porque nuestras lámparas se están apagando”. 9 “No —respondieron estas—, porque así no va a alcanzar ni para nosotras ni para ustedes. Es mejor que vayan a los que venden aceite y compren para ustedes mismas”. 10 Mientras iban a comprar el aceite, llegó el novio. Las jóvenes que estaban preparadas entraron con él al banquete de bodas. Y se cerró la puerta. 11 Después llegaron también las otras. “¡Señor, Señor —decían—, ábrenos!”. 12 “¡Les aseguro que no las conozco!”, respondió él. 13 »Por tanto —agregó Jesús—, manténganse despiertos porque no saben ni el día ni la hora.",version:"NVI"},textosApoyo:["Mateo 25:1-13","Isaías 54:5","Oseas 2:19","Mateo 9:15","Juan 10:28","Romanos 8:38-39","Hebreos 10:14","Romanos 11:29","1 Juan 2:19","Juan 3:16","Romanos 10:9","Romanos 8:16","Efesios 1:13","2 Corintios 13:5","Juan 17:3","1 Tesalonicenses 5:9-10"],ideaCentral:"",porQueNoConvencional:"",numeracionRomana:!0,titulos:{conclusion:"Conclusión"},buenaNoticia:["1 Tesalonicenses 5:9-10 (NVI)","9 pues Dios no nos destinó a sufrir el castigo, sino a recibir la salvación por medio de nuestro Señor Jesucristo. 10 Él murió por nosotros para que, en la vida o en la muerte, vivamos junto con él."],introduccion:["La parábola de las diez vírgenes es una de las más conocidas y, al mismo tiempo, una de las más malinterpretadas.","Propósito bajo el Nuevo Pacto: Muchos la han usado para infundir miedo y legalismo; sin embargo, a la luz del Nuevo Pacto descubrimos que no es una amenaza para el creyente verdadero, sino una invitación a vivir con plena seguridad en Cristo, diferenciando la mera apariencia religiosa de la realidad viva del Espíritu."],bosquejo:[{titulo:"CONTEXTO HISTÓRICO Y CULTURAL",referencia:"Isaías 54:5; Oseas 2:19; Mateo 9:15",desarrollo:"",bloques:[{tipo:"lista",items:[{texto:"Trasfondo político: Israel vivía bajo la opresión romana, alimentando la expectativa popular de un Mesías meramente político y militar."},{texto:"Costumbres nupciales judías: El matrimonio constaba del compromiso legal (desposar), seguido tiempo después por la procesión nocturna del novio hacia el banquete de bodas. Las vírgenes (damas del cortejo) debían llevar su propia lámpara encendida y provisión de aceite."},{texto:"Simbolismo bíblico:"}]},{tipo:"texto",texto:"Dios como esposo de Israel:"},{tipo:"versiculo",referencia:"Isaías 54:5",version:"NVI",texto:"Tu esposo es tu Creador; su nombre es el Señor Todopoderoso. Tu Redentor es el Santo de Israel; él es el Dios de toda la tierra."},{tipo:"versiculo",referencia:"Oseas 2:19",version:"NVI",texto:"Y te haré mi esposa para siempre; te haré mi esposa en justicia y derecho, en amor y compasión."},{tipo:"texto",texto:"Jesús como el novio:"},{tipo:"versiculo",referencia:"Mateo 9:15",version:"NVI",texto:"Jesús les contestó: ¿Acaso pueden estar de luto los invitados del novio mientras él está con ellos? Llegará el día en que se les quitará el novio; entonces sí ayunarán."},{tipo:"lista",items:[{texto:"La sorpresa narrativa: El novio tarda más de lo esperado, y esa demora pone al descubierto quién está verdaderamente preparado y quién solo aparenta estarlo."}]}]},{titulo:"EXÉGESIS Y MENSAJE CENTRAL (Mateo 25:1-13)",referencia:"Mateo 25:1-13",desarrollo:"",bloques:[{tipo:"texto",texto:"Todas las vírgenes tenían lámparas: apariencia externa de fe."},{tipo:"versiculo",referencia:"Mateo 25:1",version:"NVI",texto:"El reino de los cielos será entonces semejante a diez jóvenes solteras que tomaron sus lámparas y salieron a recibir al novio."},{tipo:"texto",texto:"Prudentes vs. insensatas: diferencia en la provisión interna, no solo en la intención inicial."},{tipo:"versiculo",referencia:"Mateo 25:2-4",version:"NVI",texto:"2 Cinco de ellas eran insensatas y cinco prudentes. 3 Las insensatas llevaron sus lámparas, pero no se abastecieron de aceite. 4 En cambio, las prudentes llevaron vasijas de aceite junto con sus lámparas."},{tipo:"texto",texto:"La tardanza del esposo: prueba del tiempo, fidelidad y perseverancia."},{tipo:"versiculo",referencia:"Mateo 25:5",version:"NVI",texto:"Y como el novio tardaba en llegar, a todas les dio sueño y se durmieron."},{tipo:"texto",texto:"El anuncio de medianoche: venida pública, decisiva e inesperada del Mesías."},{tipo:"versiculo",referencia:"Mateo 25:6-7",version:"NVI",texto:"6 A medianoche se oyó un grito: “¡Ahí viene el novio! ¡Salgan a recibirlo!” 7 Entonces todas las jóvenes se despertaron y se pusieron a preparar sus lámparas."},{tipo:"texto",texto:"El aceite: realidad espiritual regeneradora que no se puede prestar ni delegar."},{tipo:"versiculo",referencia:"Mateo 25:8-9",version:"NVI",texto:"8 Las insensatas dijeron a las prudentes: “Dennos un poco de su aceite, porque nuestras lámparas se están apagando.” 9 “No”, respondieron estas, “porque así no va a alcanzar ni para nosotras ni para ustedes. Es mejor que vayan a los que venden aceite, y compren para ustedes mismas.”"},{tipo:"texto",texto:"La puerta cerrada: la oportunidad de gracia tiene un límite final."},{tipo:"versiculo",referencia:"Mateo 25:10",version:"NVI",texto:"Pero mientras ellas iban a comprar el aceite, llegó el novio. Las que estaban preparadas entraron con él al banquete de bodas. Y se cerró la puerta."},{tipo:"texto",texto:"«No las conozco»: evidencia de que jamás existió una relación redentora verdadera."},{tipo:"versiculo",referencia:"Mateo 25:11-13",version:"NVI",texto:"11 Después llegaron también las otras. “¡Señor! ¡Señor!”, suplicaban. “¡Ábrenos la puerta!” 12 “No, no las conozco”, respondió él. 13 Por tanto, manténganse despiertos, porque no saben ni el día ni la hora."}]},{titulo:"INTERPRETACIONES TEOLÓGICAS PRINCIPALES",referencia:"Mateo 25:1-13",desarrollo:"",bloques:[{tipo:"lista",items:[{texto:"Preterista: Cumplida en el año 70 d.C., como advertencia del juicio inminente sobre Jerusalén."},{texto:"Alegórica: Cada detalle funciona como un símbolo espiritual (novio = Cristo; aceite = Espíritu Santo / amor / gracia, etc.)."},{texto:"Idealista: Enseña un principio espiritual atemporal de vigilancia y autenticidad para toda generación de creyentes."},{texto:"Futurista: Apunta escatológicamente a la Segunda Venida de Cristo y al banquete final de las bodas del Cordero."}]}]},{titulo:"IMPLICACIONES DEL NUEVO PACTO",referencia:"Juan 10:28; Romanos 8:38-39; Hebreos 10:14; Romanos 11:29; 1 Juan 2:19",desarrollo:"",bloques:[{tipo:"texto",texto:"La salvación no se pierde; es la obra consumada y eterna de Cristo:"},{tipo:"versiculo",referencia:"Juan 10:28",version:"NVI",texto:"Yo les doy vida eterna, y nunca perecerán ni nadie las arrebatará de mi mano."},{tipo:"versiculo",referencia:"Romanos 8:38-39",version:"NVI",texto:"38 Estoy convencido de que ni la muerte ni la vida, ni los ángeles ni los demonios, ni lo presente ni lo por venir, ni los poderes, 39 ni lo alto ni lo profundo, ni cosa alguna en toda la creación será capaz de separarnos del amor que Dios nos ha manifestado en Cristo Jesús nuestro Señor."},{tipo:"versiculo",referencia:"Hebreos 10:14",version:"NVI",texto:"Pues con un solo sacrificio ha hecho perfectos para siempre a los que está santificando."},{tipo:"lista",items:[{texto:"La preparación no causa la salvación: la evidencia. El aceite no se gana por obras; manifiesta la obra de Dios ya efectuada en el creyente."},{texto:"Alcance integral de la salvación: Somos rescatados del presente siglo malo, de la ira venidera, y del poder y la presencia del pecado."},{texto:"La vida eterna es dádiva plena e irrevocable de Dios en comunión con Cristo:"}]},{tipo:"versiculo",referencia:"Romanos 11:29",version:"NVI",texto:"porque las dádivas de Dios y su llamado son irrevocables."},{tipo:"lista",items:[{texto:"Distinción pastoral: El creyente genuino puede descuidarse y perder temporalmente el gozo, la paz o la comunión práctica, pero nunca la vida eterna."},{texto:"La apostasía o herejía persistente demuestra que nunca hubo nuevo nacimiento:"}]},{tipo:"versiculo",referencia:"1 Juan 2:19",version:"NVI",texto:"Aunque salieron de entre nosotros, en realidad no eran de los nuestros; pues si lo hubieran sido, se habrían quedado con nosotros. Su salida sirvió para comprobar que ninguno de ellos era de los nuestros."}]},{titulo:"¿CÓMO SÉ QUE SOY SALVO?",referencia:"Juan 3:16; Romanos 10:9; Romanos 8:16; Efesios 1:13",desarrollo:"",bloques:[{tipo:"texto",texto:"Seguridad objetiva basada en la obra de Cristo y su promesa, no en mis obras:"},{tipo:"versiculo",referencia:"Juan 3:16",version:"NVI",texto:"Porque tanto amó Dios al mundo que dio a su Hijo unigénito, para que todo el que cree en él no se pierda, sino que tenga vida eterna."},{tipo:"versiculo",referencia:"Romanos 10:9",version:"NVI",texto:"Que si confiesas con tu boca que Jesús es el Señor, y crees en tu corazón que Dios lo levantó de entre los muertos, serás salvo."},{tipo:"texto",texto:"Seguridad interna por el testimonio y sello del Espíritu Santo en mí:"},{tipo:"versiculo",referencia:"Romanos 8:16",version:"NVI",texto:"El Espíritu mismo asegura a nuestro espíritu que somos hijos de Dios."},{tipo:"versiculo",referencia:"Efesios 1:13",version:"NVI",texto:"En él también ustedes, luego de haber oído el mensaje de la verdad, el evangelio que les trajo la salvación, y luego de haber creído, fueron marcados con el sello que es el Espíritu Santo prometido."},{tipo:"lista",items:[{texto:"Evidencias prácticas del nuevo nacimiento: Amor genuino por Cristo y su Palabra, deseo de obedecer, transformación progresiva del carácter, disciplina amorosa del Padre y perseverancia en la fe."},{texto:"Contraste crucial: Seguridad falsa (confiar en una lámpara de apariencia externa) vs. seguridad verdadera (fruto y morada real del Espíritu)."}]}]},{titulo:"APLICACIÓN PRÁCTICA",referencia:"2 Corintios 13:5; Juan 17:3",desarrollo:"",bloques:[{tipo:"texto",texto:"Examínate a la luz del aceite (realidad de Cristo en ti):"},{tipo:"versiculo",referencia:"2 Corintios 13:5",version:"NVI",texto:"Examínense para ver si están en la fe; pruébense a sí mismos. ¿No se dan cuenta de que Jesucristo está en ustedes? ¡A menos que fracasen en la prueba!"},{tipo:"lista",items:[{texto:"Vive confiado, no atemorizado: Descansa en la obra perfecta del Esposo celestial."},{texto:"Persevera en la gracia: Aunque el Novio parezca tardar, el Espíritu Santo nos sostiene hasta el fin."},{texto:"Recuerda que la fe es personal, no transferible: Nadie puede creer ni nacer de nuevo en lugar de otro."},{texto:"Ten un corazón evangelístico: Comparte el Evangelio mientras la puerta de la gracia sigue abierta."},{texto:"Disfruta desde ahora la vida eterna (conocer íntimamente a Dios):"}]},{tipo:"versiculo",referencia:"Juan 17:3",version:"NVI",texto:"Y esta es la vida eterna: que te conozcan a ti, el único Dios verdadero, y a Jesucristo, a quien tú has enviado."}]}],aplicacion:[],cuidadoPastoral:"",ilustracion:"",conclusion:["La parábola de las diez vírgenes no es una amenaza para infundir terror en el creyente genuino, sino una solemne advertencia contra la religiosidad superficial y la apariencia vacía. El Nuevo Pacto nos enseña a velar con gozosa confianza: Cristo mismo nos asegura la entrada a las bodas, y su Espíritu Santo habita en nosotros"]}],lf={referencia:"Hebreos 4:16",texto:"Así que acerquémonos confiadamente al trono de la gracia para recibir la misericordia y encontrar la gracia que nos ayuden oportunamente."},cf={referencia:"Hebreos 10:22",texto:"Acerquémonos, pues, a Dios con corazón sincero y con la plena seguridad que da la fe, interiormente purificados de una conciencia culpable y los cuerpos lavados con agua pura."},uf={referencia:"Romanos 8:15",texto:"Y ustedes no recibieron un espíritu que de nuevo los esclavice al miedo, sino el Espíritu que los adopta como hijos y les permite clamar: «¡Abba! ¡Padre!»."},df={referencia:"Juan 8:10-11",texto:"Entonces él se incorporó y le preguntó: —Mujer, ¿dónde están? ¿Ya nadie te condena? —Nadie, Señor. Jesús dijo: —Tampoco yo te condeno. Ahora vete, y no vuelvas a pecar."},Wv={"dios-dejo-de-llevar-cuentas":[[{referencia:"Colosenses 2:14",texto:"…y anular la deuda que teníamos pendiente por los requisitos de la Ley. Él anuló esa deuda que nos era adversa, clavándola en la cruz."}],[{referencia:"Hebreos 8:12",texto:"Yo perdonaré sus iniquidades y nunca más me acordaré de sus pecados."}],[{referencia:"2 Corintios 5:19",texto:"Esto es, que en Cristo, Dios estaba reconciliando al mundo consigo mismo, no tomándole en cuenta sus pecados y encargándonos a nosotros el mensaje de la reconciliación."}]],"perdona-porque-fuiste-perdonado":[[{referencia:"Mateo 6:14-15",texto:"Porque si perdonan a otros sus ofensas, también los perdonará a ustedes su Padre celestial. Pero si no perdonan a otros sus ofensas, tampoco su Padre perdonará a ustedes las suyas."}],[{referencia:"Efesios 4:32",texto:"Más bien, sean bondadosos y compasivos unos con otros y perdónense mutuamente, así como Dios los perdonó a ustedes en Cristo."}],[{referencia:"Lucas 7:47",texto:"Por esto te digo: si ella ha amado mucho, es que sus muchos pecados le han sido perdonados. Pero a quien poco se le perdona, poco ama."}]],"hijos-no-empleados":[[{referencia:"Lucas 15:29",texto:"Pero él contestó: “¡Fíjate cuántos años te he servido sin desobedecer jamás tus órdenes y ni un cabrito me has dado para celebrar una fiesta con mis amigos!”"}],[{referencia:"Lucas 15:31",texto:"Hijo mío —le dijo su padre—, tú siempre estás conmigo y todo lo que tengo es tuyo."}],[uf]],"la-gracia-que-ensena-a-decir-no":[[{referencia:"Romanos 8:3",texto:"En efecto, la Ley no pudo liberarnos porque la carne anuló su poder; por eso Dios envió a su propio Hijo en una condición semejante a la de los pecadores, para que se ofreciera en sacrificio por el pecado. Así condenó Dios al pecado en la carne…"}],[{referencia:"Tito 2:11-12",texto:"En verdad, Dios ha manifestado a toda la humanidad su gracia, la cual trae salvación y nos enseña a rechazar la impiedad y las pasiones mundanas. Así podremos vivir en este mundo con dominio propio, justicia y devoción…"}],[df]],"descansar-es-obedecer":[[{referencia:"Hebreos 3:18-19",texto:"¿Y a quiénes juró Dios que jamás entrarían en su reposo, sino a los que desobedecieron? Como podemos ver, no pudieron entrar por causa de su incredulidad."}],[{referencia:"Mateo 11:28-30",texto:"Vengan a mí todos ustedes que están cansados y agobiados; yo les daré descanso. Carguen con mi yugo y aprendan de mí, pues yo soy apacible y humilde de corazón, y encontrarán descanso para sus almas. Porque mi yugo es suave y mi carga es liviana."}],[{referencia:"Hebreos 4:9-10",texto:"Por consiguiente, queda todavía un reposo especial para el pueblo de Dios; porque el que entra en el reposo de Dios descansa también de sus obras, así como Dios descansó de las suyas."}]],"el-martes-despues-de-pecar":[[{referencia:"Génesis 3:8-10",texto:"Cuando el día comenzó a refrescar, el hombre y la mujer oyeron que Dios el Señor andaba recorriendo el jardín; entonces corrieron a esconderse entre los árboles para que Dios no los viera. Pero Dios el Señor llamó al hombre y dijo: —¿Dónde estás? El hombre contestó: —Escuché que andabas por el jardín y tuve miedo porque estoy desnudo. Por eso me escondí."}],[{referencia:"1 Juan 2:1-2",texto:"Mis queridos hijos, escribo estas cosas para que no pequen. Pero si alguno peca, tenemos ante el Padre a un intercesor, a Jesucristo, el Justo. Él es el sacrificio por el perdón de nuestros pecados y no solo por los nuestros, sino por los de todo el mundo."}],[cf]],"el-espiritu-no-te-acusa":[[{referencia:"2 Corintios 7:10",texto:"La tristeza que proviene de Dios produce el arrepentimiento que lleva a la salvación, de la cual no hay que arrepentirse, mientras que la tristeza del mundo produce la muerte."}],[{referencia:"Juan 14:26",texto:"Pero el Consolador, el Espíritu Santo, a quien el Padre enviará en mi nombre, les enseñará todas las cosas y les hará recordar todo lo que he dicho."}],[{referencia:"Apocalipsis 12:10-11",texto:"Luego oí en el cielo un gran clamor: «Han llegado ya la salvación y el poder y el reino de nuestro Dios; ha llegado ya la autoridad de su Cristo. Porque ha sido expulsado el acusador de nuestros hermanos, el que los acusaba día y noche delante de nuestro Dios. Ellos lo han vencido por medio de la sangre del Cordero y por el mensaje del cual dieron testimonio; no valoraron tanto su vida como para evitar la muerte»."}]],"dar-sin-miedo":[[{referencia:"2 Corintios 8:9",texto:"Ya conocen la gracia de nuestro Señor Jesucristo, quien era rico y por causa de ustedes se hizo pobre, para que mediante su pobreza ustedes llegaran a ser ricos."}],[{referencia:"2 Corintios 9:7",texto:"Cada uno debe dar según lo que haya decidido en su corazón, no de mala gana ni por obligación, porque Dios ama al que da con alegría."}],[{referencia:"2 Corintios 9:8",texto:"Y Dios puede hacer que toda gracia abunde para ustedes, de manera que siempre, en toda circunstancia, tengan todo lo necesario y toda buena obra abunde en ustedes."}]],"la-cena-no-es-un-examen":[[{referencia:"Lucas 22:21-22",texto:"Pero sepan que la mano del que va a traicionarme está con la mía sobre la mesa. El Hijo del hombre se irá según está determinado, pero ¡ay de aquel que lo traiciona!"}],[{referencia:"1 Corintios 11:26",texto:"Porque cada vez que comen este pan y beben de esta copa, proclaman la muerte del Señor hasta que él venga."}],[{referencia:"1 Corintios 11:28-29",texto:"Así que cada uno debe examinarse a sí mismo antes de comer el pan y beber de la copa. Porque el que come y bebe sin discernir el cuerpo come y bebe su propia condena."},{referencia:"1 Corintios 11:33",texto:"Así que, hermanos míos, cuando se reúnan para comer, espérense unos a otros."}]],"ya-bendecido":[[{referencia:"Efesios 1:3",texto:"Bendito sea Dios, Padre de nuestro Señor Jesucristo, que nos ha bendecido en las regiones celestiales con toda bendición espiritual en Cristo."}],[{referencia:"Efesios 1:17-18",texto:"Pido que el Dios de nuestro Señor Jesucristo, el Padre glorioso, les dé el Espíritu de sabiduría y de revelación, para que lo conozcan mejor. Pido también que les sean iluminados los ojos del corazón para que sepan a qué esperanza él los ha llamado, cuál es la riqueza de su gloriosa herencia entre pueblo santo…"}],[lf]],"con-el-rostro-descubierto":[[{referencia:"2 Corintios 3:14-15",texto:"Sin embargo, la mente de ellos se embotó, de modo que hasta el día de hoy tienen puesto el mismo velo al leer el antiguo pacto. El velo no les ha sido quitado, porque solo se quita en Cristo. Hasta el día de hoy, siempre que leen a Moisés, un velo les cubre el corazón."}],[{referencia:"2 Corintios 3:16",texto:"Pero cada vez que alguien se vuelve al Señor, el velo es quitado."}],[{referencia:"2 Corintios 3:18",texto:"Así, todos nosotros, que con el rostro descubierto reflejamos como en un espejo la gloria del Señor, somos transformados a su semejanza con más y más gloria por la acción del Señor, que es el Espíritu."}]],"santo-antes-de-comportarte":[[{referencia:"1 Corintios 6:11",texto:"Y eso eran algunos de ustedes. Pero ya han sido lavados, santificados y justificados en el nombre del Señor Jesucristo y por el Espíritu de nuestro Dios."}],[{referencia:"Romanos 6:11",texto:"De la misma manera, también ustedes considérense muertos al pecado, pero vivos para Dios en Cristo Jesús."}],[{referencia:"Colosenses 3:12",texto:"Por lo tanto, como pueblo escogido de Dios, santo y amado, revístanse de afecto entrañable y de bondad, humildad, amabilidad y paciencia…"}]],"cristo-se-sento":[[{referencia:"Hebreos 10:11",texto:"Todo sacerdote celebra el culto día tras día ofreciendo repetidas veces los mismos sacrificios, que nunca pueden quitar los pecados."}],[{referencia:"Hebreos 10:12-14",texto:"Pero este sacerdote, después de ofrecer por los pecados un solo sacrificio para siempre, se sentó a la derecha de Dios en espera de que sus enemigos sean puestos por estrado de sus pies. Porque con un solo sacrificio ha perfeccionado para siempre a los que han sido santificados."}],[cf]],"el-duro-trato-del-cuerpo-no-sirve":[[{referencia:"Colosenses 2:20-23",texto:"Si con Cristo ustedes ya han muerto a los principios de este mundo, ¿por qué, como si todavía pertenecieran al mundo, se someten a preceptos tales como «no tomes en tus manos, no pruebes, no toques»? Estos preceptos, basados en reglas y enseñanzas humanas, se refieren a cosas que van a desaparecer con el uso. Tienen sin duda apariencia de sabiduría, con su afectada devoción, falsa humildad y severo trato del cuerpo, pero de nada sirven frente a los apetitos de la carne."}],[{referencia:"Romanos 7:8",texto:"Pero el pecado, aprovechando la oportunidad que le proporcionó el mandamiento, despertó en mí toda clase de codicia. Porque aparte de la Ley el pecado está muerto."}],[{referencia:"Colosenses 3:1-2",texto:"Ya que han resucitado con Cristo, busquen las cosas de arriba, donde está Cristo sentado a la derecha de Dios. Concentren su atención en las cosas de arriba, no en las de la tierra…"},{referencia:"Colosenses 3:5",texto:"Por tanto, hagan morir todo lo que es propio de la naturaleza terrenal: inmoralidad sexual, impureza, bajas pasiones, malos deseos y avaricia, la cual es idolatría."}]],"cuando-dios-corrige-no-cobra":[[{referencia:"Isaías 53:5",texto:"Él fue traspasado por nuestras rebeliones y molido por nuestras iniquidades. Sobre él recayó el castigo, precio de nuestra paz y gracias a sus heridas fuimos sanados."}],[{referencia:"Hebreos 12:7-8",texto:"Lo que soportan es para su disciplina, pues Dios los está tratando como a hijos. Porque, ¿qué hijo hay a quien el padre no disciplina? Si a ustedes se les deja sin la disciplina que todos reciben, entonces son bastardos y no hijos legítimos."}],[{referencia:"Hebreos 12:10-11",texto:"En efecto, nuestros padres nos disciplinaban por un breve tiempo, como mejor les parecía; pero Dios lo hace para nuestro bien, a fin de que participemos de su santidad. Ciertamente, ninguna disciplina, en el momento de recibirla, parece agradable, sino más bien dolorosa; sin embargo, después produce una cosecha de justicia y paz para quienes han sido entrenados por ella."}]],"sacerdotes-sin-templo":[[{referencia:"Juan 4:23-24",texto:"Pero se acerca la hora, y ha llegado ya, en que los verdaderos adoradores rendirán culto al Padre en espíritu y en verdad, porque así quiere el Padre que sean los que le adoren. Dios
