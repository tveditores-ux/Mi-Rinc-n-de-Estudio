es espíritu y quienes lo adoran deben hacerlo en espíritu y en verdad."}],[{referencia:"Hebreos 13:15-16",texto:"Así que ofrezcamos continuamente a Dios, por medio de Jesucristo, un sacrificio de alabanza, es decir, el fruto de los labios que confiesan su nombre. No se olviden de hacer el bien y de compartir con otros lo que tienen, porque esos son los sacrificios que agradan a Dios."}],[{referencia:"Colosenses 3:23-24",texto:"Hagan lo que hagan, trabajen de buena gana, como para el Señor y no como para nadie en este mundo, conscientes de que el Señor los recompensará con la herencia. Ustedes sirven a Cristo el Señor."}]],"la-mesa-que-pedro-abandono":[[{referencia:"Hechos 10:34-35",texto:"Pedro tomó la palabra y dijo: —Ahora comprendo que en realidad para Dios no hay favoritismos, sino que en toda nación él ve con agrado a los que le temen y actúan con justicia."}],[{referencia:"Gálatas 2:12-13",texto:"Antes que llegaran algunos de parte de Santiago, él solía comer con los no judíos. Pero cuando aquellos llegaron, comenzó a retraerse y a separarse de los no judíos por temor a los partidarios de la circuncisión. Entonces los demás judíos se le unieron en su hipocresía, y hasta el mismo Bernabé se dejó arrastrar por esa conducta hipócrita."}],[{referencia:"Gálatas 2:14",texto:"Cuando vi que no actuaban rectamente, como corresponde a la verdad del evangelio, le dije a Cefas delante de todos: «Si tú, que eres judío, vives como si no lo fueras, ¿por qué obligas a los no judíos a practicar el judaísmo?»."}]],"palabras-que-dan-gracia":[[{referencia:"Mateo 12:34",texto:"Camada de víboras, ¿cómo pueden ustedes que son malos decir algo bueno? De la abundancia del corazón habla la boca."}],[{referencia:"Efesios 4:29",texto:"Eviten toda conversación obscena. Por el contrario, que sus palabras contribuyan a la necesaria edificación y sean de bendición para quienes escuchan."}],[df,{referencia:"Efesios 4:15",texto:"Más bien, al vivir la verdad con amor, creceremos hasta ser en todo como aquel que es la cabeza, es decir, Cristo."}]],"embajadores-no-cobradores":[[{referencia:"2 Corintios 5:14-15",texto:"El amor de Cristo nos obliga, porque estamos convencidos de que uno murió por todos y por consiguiente todos murieron. Y él murió por todos, para que los que viven ya no vivan para sí, sino para el que murió por ellos y fue resucitado."}],[{referencia:"2 Corintios 5:18-19",texto:"Todo esto proviene de Dios, quien por medio de Cristo nos reconcilió consigo mismo y nos dio el ministerio de la reconciliación. Esto es, que en Cristo, Dios estaba reconciliando al mundo consigo mismo, no tomándole en cuenta sus pecados y encargándonos a nosotros el mensaje de la reconciliación."}],[{referencia:"2 Corintios 5:20",texto:"Así que somos embajadores de Cristo, como si Dios los exhortara a ustedes por medio de nosotros: «En nombre de Cristo les rogamos que se reconcilien con Dios»."}]],"una-vez-vuelto":[[{referencia:"Lucas 22:31-32",texto:"Simón, Simón, mira que Satanás ha pedido zarandearlos a ustedes como si fueran trigo. Pero yo he orado por ti, para que no falle tu fe. Y tú, cuando te hayas vuelto a mí, fortalece a tus hermanos."}],[{referencia:"Marcos 16:7",texto:"Pero vayan a decirles a sus discípulos y a Pedro: “Él va delante de ustedes a Galilea. Allí lo verán, tal como les dijo”."}],[{referencia:"1 Pedro 5:10",texto:"Luego de que ustedes hayan sufrido un poco de tiempo, Dios mismo, el Dios de toda gracia que los llamó a su gloria eterna en Cristo, los restaurará y los hará fuertes, firmes y estables."}]],"abraham-estaba-dormido":[[{referencia:"Génesis 15:17-18",texto:"Cuando el sol se puso y cayó la noche, aparecieron un horno humeante y una antorcha encendida, los cuales pasaban entre los animales descuartizados. En aquel día el Señor hizo un pacto con Abram. Le dijo: —A tus descendientes daré esta tierra, desde el río de Egipto hasta el gran río, el Éufrates."}],[{referencia:"Hebreos 6:17-18",texto:"Por eso Dios, queriendo demostrar claramente a los herederos de la promesa que su propósito nunca cambia, confirmó con un juramento esa promesa. Lo hizo así para que, mediante la promesa y el juramento, que son dos realidades que nunca cambian y en las cuales es imposible que Dios mienta, tengamos un estímulo poderoso los que, buscando refugio, nos aferramos a la esperanza que está delante de nosotros."}],[{referencia:"Génesis 15:6",texto:"Abram creyó al Señor y el Señor se lo reconoció como justicia."}]],"el-hijo-del-esfuerzo":[[{referencia:"Génesis 16:1-2",texto:"Saray, la esposa de Abram, no le había dado hijos. Pero como tenía una esclava egipcia llamada Agar, Saray dijo a Abram: —El Señor me ha hecho estéril. Por lo tanto, ve y acuéstate con mi esclava Agar. Tal vez por medio de ella podré formar una familia. Abram aceptó la propuesta que hizo Saray."}],[{referencia:"Génesis 17:18-19",texto:"Por eso le dijo a Dios: —¡Concédele a Ismael vivir bajo tu bendición! A lo que Dios contestó: —¡Pero es Sara, tu esposa, la que te dará un hijo, al que llamarás Isaac! Yo estableceré mi pacto con él y con sus descendientes, como pacto perpetuo."}],[{referencia:"Gálatas 4:28-31",texto:"Ustedes, hermanos, al igual que Isaac, son hijos por la promesa. Y así como en aquel tiempo el hijo nacido por decisión humana persiguió al hijo nacido por el Espíritu, así también sucede ahora. Pero ¿qué dice la Escritura? «¡Echa de aquí a la esclava y a su hijo! El hijo de la esclava jamás tendrá parte en la herencia con el hijo de la libre». Así que, hermanos, no somos hijos de la esclava, sino de la libre."}]],"las-uvas-agrias":[[{referencia:"Ezequiel 18:20",texto:"La persona que peque morirá. Ningún hijo cargará con la culpa de su padre ni el padre con la del hijo. Al justo se le pagará con justicia y al malvado se le pagará con maldad."}],[{referencia:"Gálatas 3:13",texto:"Cristo nos rescató de la maldición de la Ley al hacerse maldición por nosotros, pues está escrito: «Maldito todo el que es colgado de un madero»."}],[{referencia:"1 Pedro 1:18-19",texto:"Como bien saben, ustedes fueron rescatados de la vida absurda que heredaron de sus antepasados. El precio de su rescate no se pagó con cosas perecederas, como el oro o la plata, sino con la preciosa sangre de Cristo, como de un cordero sin mancha y sin defecto."}]],"dos-montes":[[{referencia:"Éxodo 20:18-19",texto:"Ante ese espectáculo de truenos y relámpagos, de sonidos de trompeta y de la montaña envuelta en humo, los israelitas temblaban de miedo y se mantenían a distancia. Así que suplicaron a Moisés: —Háblanos tú y te escucharemos. Si Dios nos habla, seguramente moriremos."}],[{referencia:"Hebreos 12:22-24",texto:"Por el contrario, ustedes se han acercado al monte Sión, a la Jerusalén celestial, la ciudad del Dios viviente. Se han acercado a millares y millares de ángeles, a una asamblea gozosa, a la iglesia de los primogénitos inscritos en el cielo. Se han acercado a Dios, el Juez de todos; a los espíritus de los justos que han llegado a la perfección; a Jesús, el mediador de un nuevo pacto; y a la sangre rociada, que habla mejor que la de Abel."}],[uf]],"correr-a-la-ciudad-de-refugio":[[{referencia:"Deuteronomio 19:3",texto:"Dividirás en tres partes la tierra que el Señor tu Dios te da por herencia, y construirás caminos para que cualquiera que haya matado a alguien pueda ir a refugiarse en ellas."}],[{referencia:"Números 35:26-28",texto:"Pero si el acusado sale de los límites de la ciudad de refugio adonde huyó, el vengador podrá matarlo y no será culpable de homicidio si lo encuentra fuera de la ciudad. Así que el acusado debe permanecer en su ciudad de refugio hasta la muerte del sumo sacerdote. Después de eso podrá volver a su heredad."}],[{referencia:"Hebreos 6:19-20",texto:"Tenemos como firme y segura ancla del alma una esperanza que penetra hasta detrás de la cortina del santuario, hasta donde Jesús entró por nosotros para abrirnos camino, llegando a ser sumo sacerdote para siempre, según el orden de Melquisedec."}]],"mirar-no-es-hacer":[[{referencia:"Números 21:8-9",texto:"…y el Señor le dijo: —Hazte una serpiente y ponla en un asta. Todos los que sean mordidos y la miren, vivirán. Moisés hizo una serpiente de bronce y la puso en un asta. Los que eran mordidos miraban a la serpiente de bronce y vivían."}],[{referencia:"Isaías 45:22",texto:"Vuelvan a mí y sean salvos, todos los confines de la tierra, porque yo soy Dios y no hay ningún otro."}],[{referencia:"2 Reyes 18:4",texto:"Quitó los altares paganos, destrozó las piedras sagradas y quebró las imágenes de la diosa Aserá. Además, destruyó la serpiente de bronce que Moisés había hecho, pues los israelitas todavía le quemaban incienso, y la llamaban Nejustán."}]],"un-sumo-sacerdote-que-sabe":[[{referencia:"Hebreos 4:15",texto:"Porque no tenemos un sumo sacerdote incapaz de compadecerse de nuestras debilidades, sino uno que ha sido tentado en todo de la misma manera que nosotros, aunque sin pecado."}],[{referencia:"Hebreos 2:17-18",texto:"Por eso era preciso que en todo se pareciera a sus hermanos, para ser un sumo sacerdote fiel y compasivo al servicio de Dios, a fin de obtener el perdón de los pecados del pueblo. Por haber sufrido él mismo la tentación, puede socorrer a los que son tentados."}],[lf]],"la-circuncision-que-cuenta":[[{referencia:"Filipenses 3:4-6",texto:"Yo mismo tengo motivos para tal confianza. Si cualquier otro cree tener motivos para confiar en esfuerzos humanos, yo más: circuncidado al octavo día, del pueblo de Israel, de la tribu de Benjamín, un verdadero hebreo; en cuanto a la interpretación de la Ley, fariseo; en cuanto al celo, perseguidor de la iglesia; en cuanto a la justicia que la Ley exige, intachable."}],[{referencia:"Deuteronomio 30:6",texto:"El Señor tu Dios circuncidará tu corazón y el de tus descendientes, para que lo ames con todo tu corazón y con toda tu alma y así tengas vida."}],[{referencia:"Filipenses 3:7-9",texto:"Sin embargo, todo aquello que para mí era ganancia, ahora lo considero pérdida por causa de Cristo. Es más, todo lo considero pérdida por razón del incomparable valor de conocer a Cristo Jesús, mi Señor. Por él lo he perdido todo y lo tengo por estiércol, a fin de ganar a Cristo y encontrarme unido a él. No quiero mi propia justicia que procede de la Ley, sino la que se obtiene mediante la fe en Cristo, la justicia que procede de Dios, basada en la fe."}]],"una-moabita-en-la-genealogia":[[{referencia:"Deuteronomio 23:3",texto:"No podrán entrar en la asamblea del Señor los amonitas ni los moabitas, ni ninguno de sus descendientes, hasta la décima generación."}],[{referencia:"Rut 2:12",texto:"¡Que el Señor te recompense por lo que has hecho! Que el Señor, Dios de Israel, bajo cuyas alas has venido a refugiarte, te lo pague con creces."},{referencia:"Rut 3:9",texto:"—¿Quién eres? —preguntó. —Soy Rut, su sierva. Extienda sobre mí el borde de su manto, ya que usted es un pariente que me puede redimir."}],[{referencia:"Mateo 1:5",texto:"Salmón, padre de Booz, cuya madre fue Rajab; Booz, padre de Obed, cuya madre fue Rut; Obed, padre de Isaí…"}]],"el-jubileo-empezo-en-nazaret":[[{referencia:"Levítico 25:10",texto:"El año cincuenta será declarado santo, y se proclamará en el país la liberación de todos sus habitantes. Será para ustedes un jubileo y cada uno volverá a su heredad familiar y a su propio clan."}],[{referencia:"Isaías 61:1-2",texto:"El Espíritu del Señor y Dios está sobre mí, por cuanto me ha ungido para anunciar buenas noticias a los pobres. Me ha enviado a sanar los corazones heridos, a proclamar libertad a los cautivos y la liberación de los prisioneros, a pregonar el año del favor del Señor y el día de la venganza de nuestro Dios, a consolar a todos los que están de duelo…"}],[{referencia:"Levítico 25:9",texto:"El día diez del mes séptimo, es decir, el día del Perdón, harás resonar la trompeta por todo el país."}]],"bastate-mi-gracia":[[{referencia:"2 Corintios 12:7-8",texto:"Para evitar que me volviera presumido por estas sublimes revelaciones, una espina me fue clavada en el cuerpo, es decir, un mensajero de Satanás, para que me atormentara. Tres veces rogué al Señor que me la quitara…"}],[{referencia:"2 Corintios 12:9",texto:"…pero él me dijo: «Te basta con mi gracia, pues mi poder se perfecciona en la debilidad». Por lo tanto, gustosamente presumiré más bien de mis debilidades, para que permanezca sobre mí el poder de Cristo."}],[{referencia:"2 Corintios 12:10",texto:"Por eso me regocijo en debilidades, insultos, privaciones, persecuciones y dificultades que sufro por Cristo; porque, cuando soy débil, entonces soy fuerte."}]],"pan-para-hoy":[[{referencia:"Éxodo 16:4",texto:"Entonces el Señor dijo a Moisés: «Voy a hacer que llueva pan del cielo. El pueblo deberá salir todos los días a recoger su ración diaria. Voy a ponerlos a prueba, para ver si cumplen o no mis instrucciones…»."}],[{referencia:"Éxodo 16:19-20",texto:"Entonces Moisés les dijo: —Nadie debe guardar nada para el día siguiente. Hubo algunos que no hicieron caso a Moisés y guardaron algo para el día siguiente, pero lo guardado se llenó de gusanos y comenzó a apestar. Entonces Moisés se enojó contra ellos."}],[{referencia:"Lamentaciones 3:22-23",texto:"Por el gran amor del Señor no hemos sido consumidos y su compasión jamás se agota. Cada mañana se renuevan sus bondades; ¡muy grande es su fidelidad!"}]],"levantate-y-come":[[{referencia:"1 Reyes 19:4",texto:"…y caminó todo un día por el desierto. Llegó adonde había un arbusto de retama y se sentó a su sombra con ganas de morirse. «¡Estoy harto, Señor! —protestó—. Quítame la vida, pues no soy mejor que mis antepasados»."}],[{referencia:"1 Reyes 19:5-8",texto:"Luego se acostó debajo del arbusto y se quedó dormido. De repente, un ángel lo tocó y le dijo: «Levántate y come». Elías miró a su alrededor y vio a su cabecera un panecillo cocido sobre brasas y un jarro de agua. Comió, bebió y volvió a acostarse. El ángel del Señor regresó y, tocándolo, le dijo: «Levántate y come, porque te espera un largo viaje». Elías se levantó, comió y bebió. Una vez fortalecido por aquella comida, viajó cuarenta días y cuarenta noches hasta que llegó a Horeb, el monte de Dios."}],[{referencia:"1 Reyes 19:11-12",texto:"El Señor le ordenó: —Sal y preséntate ante mí en la montaña, porque estoy a punto de pasar por allí. Mientras estaba allí, el Señor pasó y vino un viento recio, tan violento que partió las montañas y destrozó las rocas, pero el Señor no estaba en el viento. Después del viento hubo un terremoto, pero el Señor tampoco estaba en el terremoto. Tras el terremoto vino un fuego, pero el Señor tampoco estaba en el fuego. Y después del fuego vino un suave murmullo."}]],"deje-a-trofimo-enfermo":[[{referencia:"2 Timoteo 4:20",texto:"Erasto se quedó en Corinto; a Trófimo lo dejé enfermo en Mileto."}],[{referencia:"Juan 9:1-3",texto:"A su paso, Jesús vio a un hombre que era ciego de nacimiento. Y sus discípulos preguntaron: —Rabí, para que este hombre haya nacido ciego, ¿quién pecó, él o sus padres? —No está así debido a sus pecados ni a los de sus padres —respondió Jesús—, sino que esto sucedió para que la obra de Dios se hiciera evidente en su vida."}],[{referencia:"Santiago 5:14-16",texto:"¿Está enfermo alguno de ustedes? Haga llamar a los líderes de la iglesia para que oren por él y lo unjan con aceite en el nombre del Señor. La oración de fe sanará al enfermo y el Señor lo levantará. Y si ha cometido pecados, sus pecados se le perdonarán. Por eso, confiésense unos a otros sus pecados y oren unos por otros, para que sean sanados. La oración del justo es poderosa y eficaz."}]],"llorar-con-esperanza":[[{referencia:"Juan 11:33-36",texto:"Al ver llorar a María y a los judíos que la habían acompañado, Jesús se turbó y se conmovió profundamente. —¿Dónde lo han puesto? —preguntó. —Ven a verlo, Señor —le respondieron. Jesús lloró. —¡Miren cuánto lo quería! —dijeron los judíos."}],[{referencia:"1 Tesalonicenses 4:13-14",texto:"Hermanos, no queremos que ignoren lo que va a pasar con los que ya han muerto, para que no se entristezcan como esos otros que no tienen esperanza. ¿Acaso no creemos que Jesús murió y resucitó? Así también Dios resucitará con Jesús a los que han muerto en unión con él."}],[{referencia:"Romanos 12:15",texto:"Alégrense con los que están alegres; lloren con los que lloran."}]],"dios-mio-por-que":[[{referencia:"Salmo 13:1",texto:"¿Hasta cuándo, Señor, me tendrás en el olvido? ¿Hasta cuándo esconderás de mí tu rostro?"},{referencia:"Salmo 88:13-14",texto:"Yo, Señor, te ruego que me ayudes; por la mañana mi oración llega ante tu presencia. ¿Por qué me rechazas, Señor? ¿Por qué escondes de mí tu rostro?"},{referencia:"Salmo 88:18",texto:"Me has quitado amigos y seres queridos; ahora solo tengo amistad con las tinieblas."},{referencia:"Habacuc 1:2",texto:"¿Hasta cuándo, Señor, he de pedirte ayuda sin que tú me escuches? ¿Hasta cuándo he de clamar «¡violencia!», sin que tú nos salves?"},{referencia:"Lamentaciones 3:1-8",texto:"Yo soy aquel que ha sufrido la aflicción bajo la vara de su ira. Me ha hecho andar en las tinieblas y no en la luz. Todo el día, una y otra vez, su mano se ha vuelto contra mí. Ha hecho que mi carne y mi piel envejezcan; me ha quebrantado los huesos. Me ha tendido un cerco de amargura y tribulaciones. Me obliga a vivir en las tinieblas, como a los que hace tiempo murieron. Me tiene encerrado, no puedo escapar; me ha puesto pesadas cadenas. Por más que grito y pido ayuda, él rechaza mi oración."}],[{referencia:"Mateo 27:46",texto:"Como a las tres de la tarde, Jesús gritó con fuerza: —Elí, Elí, ¿lema sabactani? —que significa “Dios mío, Dios mío, ¿por qué me has abandonado?”."},{referencia:"Salmo 22:1",texto:"Dios mío, Dios mío, ¿por qué me has abandonado? ¿Por qué estás lejos para salvarme, tan lejos de mis gritos de angustia?"},{referencia:"Hebreos 5:7",texto:"En los días de su vida mortal, Jesús ofreció oraciones y súplicas con fuerte clamor y lágrimas al que podía salvarlo de la muerte y fue escuchado por su temor reverente."},{referencia:"Hebreos 13:5",texto:"Manténganse libres del amor al dinero y conténtense con lo que tienen, porque Dios ha dicho: «Nunca los dejaré; jamás los abandonaré»."}],[{referencia:"Salmo 13:5-6",texto:"Pero yo confío en tu gran amor; mi corazón se alegra en tu salvación. Cantaré salmos al Señor, porque ha sido bueno conmigo."},{referencia:"Lamentaciones 3:21-24",texto:"Pero algo más me viene a la memoria, lo cual me llena de esperanza: Por el gran amor del Señor no hemos sido consumidos y su compasión jamás se agota. Cada mañana se renuevan sus bondades; ¡muy grande es su fidelidad! Me digo a mí mismo: «El Señor es mi herencia. ¡En él esperaré!»."},{referencia:"Salmo 22:24",texto:"Porque él no desprecia ni tiene en poco el sufrimiento del pobre; no esconde de él su rostro, sino que lo escucha cuando a él clama."},{referencia:"Romanos 8:26",texto:"Así mismo, en nuestra debilidad el Espíritu acude a ayudarnos. No sabemos qué pedir, pero el Espíritu mismo intercede por nosotros con gemidos que no pueden expresarse con palabras."},{referencia:"Isaías 50:10",texto:"¿Quién entre ustedes teme al Señor y obedece la voz de su siervo? Aunque camine en la oscuridad y sin un rayo de luz, que confíe en el nombre del Señor y dependa de su Dios."}]],"aun-en-la-vejez-fructificaran":[[{referencia:"Isaías 46:3-4",texto:"Escúchenme, descendientes de Jacob, todo el resto del pueblo de Israel, a quienes he cargado desde el vientre y he llevado desde la cuna. Aun en la vejez, cuando ya peinen canas, yo seré el mismo, yo los sostendré. Yo los hice y cuidaré de ustedes; los sostendré y los libraré."}],[{referencia:"Salmo 92:12-14",texto:"Como palmeras florecen los justos; como cedros del Líbano crecen. Plantados en la casa del Señor, florecen en los atrios de nuestro Dios. Aun en su vejez, darán fruto, siempre estarán saludables y frondosos…"}],[{referencia:"2 Corintios 4:16",texto:"Por tanto, no nos desanimamos. Al contrario, aunque por fuera nos vamos desgastando, por dentro nos vamos renovando día tras día."}]],"la-espera-no-es-castigo":[[{referencia:"Juan 11:5-6",texto:"Jesús amaba a Marta, a su hermana y a Lázaro. A pesar de eso, cuando oyó que Lázaro estaba enfermo, se quedó dos días más donde se encontraba.",nota:"La NVI traduce la conjunción griega oun («por tanto»; RVR1960: «pues») como «A pesar de eso». En el original, el versículo 6 se presenta como consecuencia del amor del versículo 5: porque los amaba, se quedó."}],[{referencia:"Romanos 4:20-21",texto:"Ante la promesa de Dios no dudó como un incrédulo, sino que se reafirmó en su fe y dio gloria a Dios, plenamente convencido de que Dios tenía poder para cumplir lo que había prometido."}],[{referencia:"Isaías 40:31",texto:"…pero los que confían en el Señor renovarán sus fuerzas; levantarán el vuelo como las águilas, correrán y no se fatigarán, caminarán y no se cansarán."}]],"librados-del-temor-de-la-muerte":[[{referencia:"Hebreos 2:14-15",texto:"Por tanto, ya que ellos son de carne y hueso, él también compartió esa naturaleza humana para anular, mediante la muerte, al que tiene el dominio de la muerte —es decir, al diablo—, y librar a todos los que por temor a la muerte estaban sometidos a esclavitud durante toda la vida."}],[{referencia:"1 Corintios 15:55-57",texto:"«¿Dónde está, oh muerte, tu victoria? ¿Dónde está, oh muerte, tu aguijón?». El aguijón de la muerte es el pecado y el poder del pecado es la Ley. ¡Pero gracias a Dios que nos da la victoria por medio de nuestro Señor Jesucristo!"}],[{referencia:"Filipenses 1:21-23",texto:"Porque para mí el vivir es Cristo y el morir es ganancia. Ahora bien, si seguir viviendo en este cuerpo representa para mí un trabajo fructífero, ¿qué escogeré? ¡No lo sé! Me siento presionado por dos posibilidades: deseo partir y estar con Cristo, que es muchísimo mejor…"}]],"enjugara-toda-lagrima":[[{referencia:"Apocalipsis 21:3",texto:"Oí una potente voz que provenía del trono y decía: «¡Aquí, entre los seres humanos, está el santuario de Dios! Él habitará en medio de ellos y ellos serán su pueblo; Dios mismo estará con ellos y será su Dios."}],[{referencia:"Apocalipsis 21:4",texto:"Él enjugará toda lágrima de los ojos. Ya no habrá muerte ni llanto, tampoco lamento ni dolor, porque las primeras cosas han dejado de existir»."}],[{referencia:"Apocalipsis 22:17",texto:"El Espíritu y la novia dicen: «¡Ven!»; y el que escuche diga: «¡Ven!». El que tenga sed, venga; y el que quiera, tome gratuitamente del agua de la vida."}]],"la-persona-de-fe-sabe-cambiar-de-plan":[[{referencia:"Santiago 4:13-16",texto:"Ahora escuchen esto, ustedes que dicen: «Hoy o mañana iremos a tal o cual ciudad, pasaremos allí un año, haremos negocios y ganaremos dinero». ¡Y eso que ni siquiera saben qué sucederá mañana! ¿Qué es su vida? Ustedes son como la niebla que aparece por un momento y luego se desvanece. Más bien, debieran decir: «Si el Señor quiere, viviremos y haremos esto o aquello». Pero ahora se jactan en sus fanfarronerías. Toda esta jactancia es mala."},{referencia:"Proverbios 27:1",texto:"No te jactes del día de mañana, porque no sabes lo que el día traerá."}],[{referencia:"Hechos 16:6-10",texto:"Atravesaron la región de Frigia y Galacia, ya que el Espíritu Santo había impedido que predicaran la palabra en la provincia de Asia. Cuando llegaron cerca de Misia, intentaron pasar a Bitinia, pero el Espíritu de Jesús no se lo permitió. Entonces, pasando de largo por Misia, bajaron a Troas. Durante la noche Pablo tuvo una visión en la que un hombre de Macedonia, puesto de pie, rogaba: «Pasa a Macedonia y ayúdanos». Después de que Pablo tuvo la visión, enseguida nos preparamos para partir hacia Macedonia, convencidos de que Dios nos había llamado a anunciar las buenas noticias a los macedonios."},{referencia:"Proverbios 16:9",texto:"El corazón del hombre traza su rumbo, pero sus pasos los dirige el Señor."}],[{referencia:"2 Corintios 1:15-17",texto:"Confiando en esto, quise visitarlos primero a ustedes para que recibieran una doble bendición; es decir, visitarlos de paso a Macedonia y verlos otra vez a mi regreso de allá. Así podrían ayudarme a seguir el viaje a Judea. Al proponerme esto, ¿acaso lo hice a la ligera? ¿O es que hago mis planes según criterios meramente humanos, de manera que diga «sí, sí» y «no, no» al mismo tiempo?"},{referencia:"2 Corintios 1:18-20",texto:"Pero tan cierto como que Dios es fiel, el mensaje que les hemos dirigido no es «sí» y «no». Porque el Hijo de Dios, Jesucristo, a quien Silvano, Timoteo y yo predicamos entre ustedes, no fue «sí» y «no»; en él siempre ha sido «sí». Todas las promesas que ha hecho Dios son «sí» en Cristo. Así que por medio de Cristo respondemos «amén» para la gloria de Dios."},{referencia:"2 Corintios 1:23",texto:"¡Por mi vida! Invoco a Dios como testigo de que todavía no he ido a Corinto solo por consideración a ustedes."}]],"leer-la-biblia-no-es-consultar-un-horoscopo":[[{referencia:"Mateo 4:5-7",texto:"Luego el diablo lo llevó a la ciudad santa e hizo que se pusiera de pie sobre la parte más alta del Templo y le dijo: —Si eres el Hijo de Dios, tírate abajo. Pues escrito está: “Ordenará que sus ángeles te protejan y ellos te sostendrán en sus manos para que no tropieces con piedra alguna”. —También está escrito: “No pongas a prueba al Señor tu Dios” —contestó Jesús."},{referencia:"Juan 5:39-40",texto:"Ustedes estudian con diligencia las Escrituras porque piensan que en ellas hallan la vida eterna. ¡Y son ellas las que dan testimonio en mi favor! Sin embargo, ustedes no quieren venir a mí para tener esa vida."}],[{referencia:"Lucas 24:27",texto:"Entonces, comenzando por Moisés y por todos los Profetas, les explicó lo que se refería a él en todas las Escrituras."},{referencia:"Lucas 24:32",texto:"Se decían el uno al otro: —¿No ardía nuestro corazón mientras conversaba con nosotros en el camino y nos explicaba las Escrituras?"},{referencia:"Lucas 24:44-45",texto:"Luego dijo: —Cuando todavía estaba yo con ustedes, les decía que tenía que cumplirse todo lo que está escrito acerca de mí en la Ley de Moisés, en los Profetas y en los Salmos. Entonces les abrió el entendimiento para que comprendieran las Escrituras."}],[{referencia:"2 Timoteo 3:14-17",texto:"Pero tú permanece firme en lo que has aprendido y de lo cual estás convencido, pues sabes de quiénes lo aprendiste. Desde tu niñez conoces las Sagradas Escrituras, que pueden darte la sabiduría necesaria para la salvación mediante la fe en Cristo Jesús. Toda la Escritura es inspirada por Dios y útil para enseñar, para reprender, para corregir y para instruir en la justicia, a fin de que el siervo de Dios esté enteramente capacitado para toda buena obra."},{referencia:"Salmo 119:105",texto:"Tu palabra es una lámpara a mis pies; es una luz en mi sendero."},{referencia:"Hechos 17:11",texto:"Estos eran de sentimientos más nobles que los de Tesalónica, de modo que estuvieron muy dispuestos a recibir el mensaje y todos los días examinaban las Escrituras para ver si era verdad lo que se les anunciaba."}]]},ex={"dios-mio-por-que":"Dios mío, Dios mío, ¿por qué me has abandonado? ¿Por qué estás lejos para salvarme, tan lejos de mis gritos de angustia? [...] Como a las tres de la tarde, Jesús gritó con fuerza: —Elí, Elí, ¿lema sabactani? —que significa “Dios mío, Dios mío, ¿por qué me has abandonado?”.","la-persona-de-fe-sabe-cambiar-de-plan":"Ahora escuchen esto, ustedes que dicen: «Hoy o mañana iremos a tal o cual ciudad, pasaremos allí un año, haremos negocios y ganaremos dinero». ¡Y eso que ni siquiera saben qué sucederá mañana! ¿Qué es su vida? Ustedes son como la niebla que aparece por un momento y luego se desvanece. Más bien, debieran decir: «Si el Señor quiere, viviremos y haremos esto o aquello».","leer-la-biblia-no-es-consultar-un-horoscopo":"Entonces, comenzando por Moisés y por todos los Profetas, les explicó lo que se refería a él en todas las Escrituras. [...] Toda la Escritura es inspirada por Dios y útil para enseñar, para reprender, para corregir y para instruir en la justicia, a fin de que el siervo de Dios esté enteramente capacitado para toda buena obra."},fn=[{id:1,nombre:"Serie 1",titulo:"Descansar en la gracia",descripcion:"Trece temas para sanar la relación con el Padre: perdón, identidad, descanso, culpa, confianza y el corazón del Padre que busca a los perdidos."},{id:2,nombre:"Serie 2",titulo:"Caminar en la gracia",descripcion:"Diez temas para llevar el nuevo pacto a la vida diaria: la Biblia, los hábitos, el trabajo, la lengua, la mesa, la misión y la restauración."},{id:3,nombre:"Serie 3",titulo:"Figuras del pacto",descripcion:"Diez temas que leen el Antiguo Testamento desde Cristo: pactos, montes, ciudades de refugio, serpientes de bronce, moabitas y jubileos que ya hablaban de la gracia."},{id:4,nombre:"Serie 4",titulo:"Gracia para las estaciones difíciles",descripcion:"Diez temas para cuando la vida duele: debilidad, ansiedad, agotamiento, enfermedad, duelo, silencio de Dios, vejez, espera, muerte y esperanza."}],wc=[{id:"culpa",etiqueta:"Culpa y condenación",descripcion:"Creyentes que viven bajo vergüenza crónica"},{id:"cansancio",etiqueta:"Cansancio y agotamiento",descripcion:"Servidores agotados, sin fuerzas o sin motivación"},{id:"legalismo",etiqueta:"Legalismo y comparación",descripcion:"Iglesias con mentalidad de mérito"},{id:"relaciones",etiqueta:"Relaciones rotas",descripcion:"Heridas, rencor y falta de perdón"},{id:"finanzas",etiqueta:"Trabajo y finanzas",descripcion:"Dinero, vocación y generosidad"},{id:"oracion",etiqueta:"Vida devocional",descripcion:"Oración y lectura bíblica sin culpa"},{id:"habitos",etiqueta:"Hábitos y luchas",descripcion:"Pecados recurrentes y recaídas"},{id:"miedo",etiqueta:"Miedo a Dios",descripcion:"Imagen distorsionada del Padre"},{id:"sufrimiento",etiqueta:"Dolor y pérdida",descripcion:"Enfermedad, duelo, silencio de Dios"},{id:"ansiedad",etiqueta:"Ansiedad y espera",descripcion:"Incertidumbre, futuro y tiempos de Dios"},{id:"pasado",etiqueta:"Origen y pasado",descripcion:"Familia, exclusión y sentirse descalificado"}],ax=[{titulo:"Ley en el corazón",cita:"«Pondré mis leyes en la mente de ellos, y sobre su corazón las escribiré» — Hebreos 8:10",explicacion:"La obediencia deja de ser presión externa y se convierte en deseo interno producido por el Espíritu."},{titulo:"Relación garantizada",cita:"«Y seré a ellos por Dios, y ellos me serán a mí por pueblo» — Hebreos 8:10",explicacion:"La pertenencia no depende del desempeño del pueblo sino de la fidelidad del que promete."},{titulo:"Conocimiento directo",cita:"«Todos me conocerán, desde el menor hasta el mayor de ellos» — Hebreos 8:11",explicacion:"Acceso sin intermediarios: cada creyente conoce al Padre por el Espíritu."},{titulo:"Perdón definitivo",cita:"«Nunca más me acordaré de sus pecados y de sus iniquidades» — Hebreos 8:12",explicacion:"El fundamento de todo lo anterior: un perdón que no se renueva porque nunca se agota."}],ox=[{id:"dios-dejo-de-llevar-cuentas",numero:1,serie:1,titulo:"Dios dejó de llevar cuentas",subtitulo:"El fin de la contabilidad espiritual",etiquetas:["Identidad","Perdón","Culpa"],necesidades:["culpa","miedo"],textoBase:{referencia:"Hebreos 8:12",texto:"Porque seré propicio a sus injusticias, y nunca más me acordaré de sus pecados y de sus iniquidades.",version:"RVR1960"},textosApoyo:["2 Corintios 5:19","Romanos 4:7-8","Hebreos 10:17-18","Colosenses 2:13-14","1 Corintios 13:5","Salmo 103:12"],ideaCentral:"Bajo el nuevo pacto, Dios no está actualizando un registro de tus fallas: el libro se cerró en la cruz. Y el Dios que no lleva cuentas contigo te libera para dejar de llevar cuentas con los demás.",porQueNoConvencional:"Muchos creyentes viven como si Dios tuviera una hoja de cálculo celestial donde cada domingo suma y cada tropiezo resta. Predicamos «perdón», pero vivimos «saldo». Este tema desmonta la imagen de Dios como contador y presenta al Dios que eligió no recordar.",bosquejo:[{titulo:"El registro que existía",referencia:"Colosenses 2:14",desarrollo:"Había un acta de decretos que nos era contraria. Pablo no dice que fue archivada ni reducida: fue clavada en la cruz. Lo que Dios clava, no lo vuelve a consultar."},{titulo:"La memoria que Dios eligió",referencia:"Hebreos 8:12; 10:17",desarrollo:"«Nunca más me acordaré» no es olvido por debilidad sino decisión pactual de no traer a cuenta. Dios lo sabe todo, pero ha decidido no cobrarte nada."},{titulo:"La contabilidad que tú heredas",referencia:"2 Corintios 5:19; 1 Corintios 13:5",desarrollo:"El ministerio de la reconciliación consiste en dejar de tomar en cuenta a otros lo que Dios no te toma en cuenta a ti. El amor «no toma en cuenta el mal recibido» porque nació de un Dios que hizo exactamente eso."}],aplicacion:["Identifica la «cuenta» que estás llevando (contigo mismo o con alguien) y nómbrala en oración: «Señor, tú no llevas esta cuenta; yo tampoco la llevaré».","Cuando regrese el recuerdo de un pecado ya confesado, responde en voz alta con Hebreos 10:17. La memoria de Dios manda sobre la tuya.","Deja de «compensar» a Dios con actividad religiosa después de fallar. Ve a Él primero, no después de haber pagado."],cuidadoPastoral:"Que Dios no lleve cuentas no significa que el pecado no tenga consecuencias naturales ni que desaparezca la disciplina del Padre (Hebreos 12:6). Pero la disciplina es de un Padre que forma hijos, no de un juez que cobra a deudores.",ilustracion:"Un contador explica la diferencia entre «cuenta pendiente» y «cuenta cancelada»: la pendiente genera intereses cada día; la cancelada se archiva y nadie vuelve a abrirla. La cruz no redujo tu deuda: la canceló."},{id:"perdona-porque-fuiste-perdonado",numero:2,serie:1,titulo:"Perdona porque ya fuiste perdonado",subtitulo:"La dirección del perdón cambió en la cruz",etiquetas:["Perdón","Relaciones"],necesidades:["relaciones","culpa"],textoBase:{referencia:"Efesios 4:32",texto:"Antes sed benignos unos con otros, misericordiosos, perdonándoos unos a otros, como Dios también os perdonó a vosotros en Cristo.",version:"RVR1960"},textosApoyo:["Colosenses 3:13","Mateo 6:14-15","Mateo 18:21-35","Lucas 7:47","1 Juan 4:19"],ideaCentral:"Antes de la cruz, el perdón se planteaba como condición («si perdonáis… os perdonará»). Después de la cruz se plantea como consecuencia («como Dios os perdonó»). No perdonas para ser perdonado: perdonas porque ya lo fuiste, y eso cambia todo el peso de la tarea.",porQueNoConvencional:"Mateo 6:15 suele predicarse como amenaza vigente sobre creyentes, produciendo un perdón forzado por miedo. Este tema muestra cómo el orden gramatical de las epístolas revela el orden del nuevo pacto: primero recibes, luego das.",bosquejo:[{titulo:"El perdón como requisito",referencia:"Mateo 6:14-15; 18:35",desarrollo:"Jesús, antes de la cruz, expone la lógica del reino a un pueblo bajo la ley: nadie que haya entendido cuánto se le perdonó puede retener el perdón. El siervo malvado no fue castigado por no pagar, sino por no reflejar."},{titulo:"El perdón como resultado",referencia:"Efesios 4:32; Colosenses 3:13",desarrollo:"Después de la cruz, el «como» deja de ser condición y se convierte en modelo y fuente. Perdonamos «de la manera que Cristo nos perdonó»: primero, completamente y sin esperar merecimiento."},{titulo:"El perdón como libertad",referencia:"Lucas 7:47",desarrollo:"El que sabe que se le perdonó mucho, ama mucho. Cuando alguien no logra perdonar, el problema rara vez es la ofensa recibida; casi siempre es que no ha visto el tamaño de la deuda que le fue cancelada."}],aplicacion:["Escribe en una columna la deuda que alguien tiene contigo y en la otra la deuda que Dios canceló de ti (Mateo 18: diez mil talentos frente a cien denarios). Mira la proporción.","Perdonar no es sentir; es decidir no cobrar. Declara el perdón aunque la emoción llegue después.","Distingue perdón (unilateral, siempre posible) de reconciliación (bilateral, requiere arrepentimiento y confianza restaurada)."],cuidadoPastoral:"Perdonar no exige exponerse otra vez al abuso. Se puede perdonar y mantener límites sabios. No se trata de negar el dolor, sino de entregar el derecho de cobrarlo.",ilustracion:"Diez mil talentos equivalían a unos sesenta millones de días de salario: una cifra absurda a propósito. Jesús quiere que veamos lo desproporcionado de nuestra deuda cancelada frente a cualquier ofensa que hayamos recibido."},{id:"hijos-no-empleados",numero:3,serie:1,titulo:"Hijos, no empleados",subtitulo:"El hermano mayor también estaba perdido",etiquetas:["Identidad","Servicio","Legalismo"],necesidades:["legalismo","cansancio"],textoBase:{referencia:"Lucas 15:31",texto:"Él entonces le dijo: Hijo, tú siempre estás conmigo, y todas mis cosas son tuyas.",version:"RVR1960"},textosApoyo:["Lucas 15:1-2, 25-30","Gálatas 4:4-7","Romanos 8:15-17","Juan 15:15","Juan 8:35"],ideaCentral:"Se puede vivir en la casa del Padre con mentalidad de empleado: sirviendo por salario, comparándose, resentido y sin disfrutar la herencia. El nuevo pacto no te contrata: te adopta.",porQueNoConvencional:"La parábola casi siempre se predica enfocada en el pródigo, pero Jesús la contó para los fariseos (Lucas 15:1-2), que se parecían al hermano mayor. El personaje más peligroso no es el que se fue, sino el que se quedó sin conocer al Padre.",bosquejo:[{titulo:"El lenguaje del empleado",referencia:"Lucas 15:29",desarrollo:"«Tantos años te sirvo… nunca me has dado». Servicio contabilizado, obediencia sin intimidad, expectativa de pago. El hermano mayor estaba en la casa, pero vivía en la nómina."},{titulo:"El corazón del Padre",referencia:"Lucas 15:28, 31",desarrollo:"El padre sale a buscar también al mayor. Le dice «hijo» (téknon, término de ternura) y le recuerda que todo ya era suyo. No lo regaña: lo invita a la fiesta."},{titulo:"El espíritu de adopción",referencia:"Romanos 8:15; Gálatas 4:6-7",desarrollo:"El Espíritu no produce empleados temerosos, sino hijos que claman «Abba». El esclavo obedece para quedarse; el hijo se queda porque pertenece."}],aplicacion:["Revisa tus motivaciones para servir: ¿esperas reconocimiento o «pago»? ¿Temes perder el favor de Dios si dejas de hacerlo? Nómbralo con honestidad.","Disfruta esta semana algo de la herencia sin culpa: descanso, comunión, gozo. «Todas mis cosas son tuyas».","Deja de mirar al hermano «pródigo» con comparación. Entra a la fiesta y siéntate a la mesa."],cuidadoPastoral:"Ser hijo no elimina el servicio, lo transforma. El hijo trabaja en la casa, pero desde la pertenencia, no para conseguirla. Predicar contra la mentalidad de empleado no es predicar contra el compromiso.",ilustracion:"Un empleado revisa su recibo de nómina; un hijo abre la nevera sin pedir permiso. El empleado pregunta «¿cuánto me toca?»; el hijo sabe que «todo es tuyo». La diferencia no está en la casa, sino en la relación."},{id:"la-gracia-que-ensena-a-decir-no",numero:4,serie:1,titulo:"La gracia que enseña a decir «no»",subtitulo:"La gracia no es permiso: es poder",etiquetas:["Santidad","Hábitos","Poder"],necesidades:["habitos","legalismo"],textoBase:{referencia:"Tito 2:11-12",texto:"Porque la gracia de Dios se ha manifestado para salvación a todos los hombres, enseñándonos que, renunciando a la impiedad y a los deseos mundanos, vivamos en este siglo sobria, justa y piadosamente.",version:"RVR1960"},textosApoyo:["Romanos 6:14","Romanos 2:4","Romanos 8:3","1 Corintios 15:10","Juan 8:10-11","Gálatas 5:16"],ideaCentral:"La gracia no es la razón por la que puedes pecar; es el poder por el que ya no tienes que hacerlo. Lo que la ley exigía sin capacitar, la gracia lo enseña y lo produce desde adentro.",porQueNoConvencional:"Se suele presentar la gracia como el «colchón» para las caídas y la ley como el «entrenador» para la santidad. Pablo dice lo contrario: la gracia es la maestra (paideúousa: la que instruye y disciplina), y el pecado se enseñorea precisamente de los que están bajo la ley.",bosquejo:[{titulo:"Lo que la ley no pudo",referencia:"Romanos 8:3; 7:8",desarrollo:"La ley diagnostica con precisión, pero el mandamiento despierta el deseo: el «no toques» aviva la codicia. La ley es santa, pero no tiene poder para producir lo que exige."},{titulo:"Lo que la gracia enseña",referencia:"Tito 2:12",desarrollo:"Renuncia y vida nueva. La gracia no solo excusa: educa. Enseña a decir «no» a la impiedad y «sí» a una vida sobria, justa y piadosa. Es un currículo completo, no una amnistía."},{titulo:"Cómo funciona en la práctica",referencia:"Juan 8:11; Romanos 2:4",desarrollo:"«Ni yo te condeno» precede a «no peques más». El orden es el secreto: la aceptación viene primero y la transformación después. La benignidad de Dios es lo que guía al arrepentimiento."}],aplicacion:["Identifica un hábito con el que has luchado «a fuerza de voluntad» y cambia la estrategia: comienza cada día recordando tu aceptación, no tu deuda.","Reemplaza la pregunta «¿esto está permitido?» por «¿esto es coherente con quien ya soy en Cristo?».","Cuando falles, vuelve rápido. La vergüenza prolongada es el combustible principal de la recaída."],cuidadoPastoral:"La gracia que no produce cambio no ha sido comprendida (Judas 4 habla de convertir la gracia en libertinaje). Pero el remedio contra la gracia barata no es la ley, sino más gracia verdadera.",ilustracion:"Un niño aprende a nadar más rápido con su padre sosteniéndolo desde abajo que con alguien gritándole instrucciones desde la orilla. La ley grita desde la orilla; la gracia se mete al agua contigo."},{id:"descansar-es-obedecer",numero:5,serie:1,titulo:"Descansar es obedecer",subtitulo:"El reposo como la obra del nuevo pacto",etiquetas:["Descanso","Fe","Agotamiento"],necesidades:["cansancio","legalismo"],textoBase:{referencia:"Hebreos 4:9-10",texto:"Por tanto, queda un reposo para el pueblo de Dios. Porque el que ha entrado en su reposo, también ha reposado de sus obras, como Dios de las suyas.",version:"RVR1960"},textosApoyo:["Mateo 11:28-30","Juan 6:28-29","Hebreos 3:18-19; 4:11","Salmo 127:1-2","Colosenses 2:16-17","Lucas 10:38-42"],ideaCentral:"El sábado era la sombra; Cristo es el reposo. Entrar en ese descanso —dejar de trabajar para ganar lo que ya te fue dado— no es pereza espiritual: es la forma más alta de fe y, según Hebreos, algo que debemos «procurar».",porQueNoConvencional:"En muchas iglesias el cansancio se ve como señal de compromiso y el descanso como falta de celo. Hebreos invierte la lógica: la desobediencia de Israel fue precisamente no entrar en el reposo (4:6, 11). Descansar en la obra terminada es obediencia.",bosquejo:[{titulo:"El descanso que Israel rechazó",referencia:"Hebreos 3:18-19; 4:6",desarrollo:"La incredulidad se manifestó como incapacidad de descansar en la promesa. No entraron por incrédulos, no por perezosos. La ansiedad religiosa es incredulidad disfrazada de diligencia."},{titulo:"El descanso que Cristo ofrece",referencia:"Mateo 11:28-30",desarrollo:"Un yugo compartido donde Él lleva el peso. «Aprended de mí» es aprender a descansar. El yugo es fácil no porque no haya trabajo, sino porque no estás tirando solo."},{titulo:"El descanso como estilo de vida",referencia:"Hebreos 4:10; Juan 6:29",desarrollo:"La «obra» del nuevo pacto es creer. Trabajamos desde el descanso, no para conseguirlo. Dios reposó el séptimo día porque la obra estaba terminada; nosotros reposamos porque Cristo dijo «consumado es»."}],aplicacion:["Haz un inventario honesto: ¿qué actividades religiosas haces por temor a perder el favor de Dios? Esas son «obras propias» de las que debes reposar.","Practica un día real de descanso semanal como acto de fe: el mundo no se cae si te detienes, porque no eres tú quien lo sostiene.","Antes de servir, siéntate primero (Lucas 10:39-42). María escogió la buena parte, y Jesús no se la quitó."],cuidadoPastoral:"Descansar de las obras propias no es dejar de obrar. Pablo «trabajó más que todos», pero «no yo, sino la gracia de Dios conmigo» (1 Corintios 15:10). Se cambia la fuente, no la actividad.",ilustracion:"El séptimo día fue el primer día completo de Adán: fue creado en el sexto y lo primero que vivió fue el reposo de Dios. El ser humano comienza su historia descansando en la obra terminada de Otro."},{id:"el-martes-despues-de-pecar",numero:6,serie:1,titulo:"El martes después de pecar",subtitulo:"Qué hacer cuando fallas bajo la gracia",etiquetas:["Culpa","Restauración","Arrepentimiento"],necesidades:["culpa","habitos"],textoBase:{referencia:"1 Juan 2:1",texto:"Hijitos míos, estas cosas os escribo para que no pequéis; y si alguno hubiere pecado, abogado tenemos para con el Padre, a Jesucristo el justo.",version:"RVR1960"},textosApoyo:["Romanos 8:1","Hebreos 7:25","Hebreos 10:19-22","Proverbios 24:16","2 Corintios 7:10-11","Miqueas 7:8"],ideaCentral:"El nuevo pacto no niega que el creyente pueda pecar; prevé qué hacer cuando ocurre. Tienes un Abogado que no te defiende negando los hechos, sino presentando su sangre. La respuesta correcta al pecado no es el autocastigo, sino el regreso inmediato.",porQueNoConvencional:"Predicamos mucho sobre cómo no pecar y casi nada sobre qué hacer el martes por la mañana después de haber pecado. Ese silencio produce creyentes que se alejan de Dios justo cuando más lo necesitan, convencidos de que deben «limpiarse primero».",bosquejo:[{titulo:"Lo que no debes hacer",referencia:"Génesis 3:8-10",desarrollo:"Esconderte (como Adán), compensar (obras para pagar) o rendirte («ya qué importa»). Las tres reacciones tienen algo en común: te alejan del único lugar donde hay remedio."},{titulo:"Lo que ya está hecho",referencia:"1 Juan 2:1-2; Hebreos 7:25",desarrollo:"Tienes un Abogado, una propiciación y una intercesión permanente. Tu caso ya fue defendido antes de que fallaras. Jesús «vive siempre para interceder»: no se toma el martes libre."},{titulo:"Lo que debes hacer",referencia:"Hebreos 10:22; 1 Juan 1:9; Proverbios 24:16",desarrollo:"Acercarte con confianza, llamar al pecado por su nombre, volver a levantarte y aprender (2 Corintios 7:10-11). El justo cae siete veces, pero lo que lo define es que se levanta."}],aplicacion:["Establece un «protocolo de retorno»: ¿cuánto tiempo pasa entre tu caída y tu regreso a la presencia del Padre? La meta es reducirlo a minutos, no a días.","Confiesa para acercarte, no para «reactivar» un perdón que ya fue dado. La confesión es acuerdo con Dios, no pago a Dios.","Comparte tu lucha con un hermano de confianza (Santiago 5:16). La gracia se experimenta en comunidad; el aislamiento es territorio del acusador."],cuidadoPastoral:"«Para que no pequéis» sigue siendo el propósito de Juan. La provisión del Abogado no es licencia: es la red de seguridad que permite al trapecista atreverse a volar, no una invitación a lanzarse a propósito.",ilustracion:"Un abogado defensor no se pone de pie cuando su cliente es inocente, sino precisamente cuando es culpable. Jesús no argumenta tu inocencia: presenta su justicia como tuya."},{id:"el-espiritu-no-te-acusa",numero:7,serie:1,titulo:"El Espíritu no te acusa",subtitulo:"Cómo distinguir la voz del Consolador de la voz del acusador",etiquetas:["Espíritu Santo","Discernimiento","Culpa"],necesidades:["culpa","miedo"],textoBase:{referencia:"Romanos 8:16",texto:"El Espíritu mismo da testimonio a nuestro espíritu, de que somos hijos de Dios.",version:"RVR1960"},textosApoyo:["Juan 16:8-11","Juan 14:26","Apocalipsis 12:10-11","Romanos 8:33-34","Zacarías 3:1-4","2 Corintios 7:10"],ideaCentral:"El Espíritu Santo convence, consuela, enseña y da testimonio de tu filiación; el acusador condena, aísla y confunde tu identidad con tu conducta. Aprender a distinguir estas dos voces es esencial para una vida cristiana sana.",porQueNoConvencional:"Muchos creyentes llaman «convicción del Espíritu» a lo que en realidad es acusación o autocondenación. Juan 16:9 dice que el Espíritu convence al mundo de pecado «por cuanto no creen»; y al creyente lo convence de justicia (v. 10): la que ya tiene en Cristo.",bosquejo:[{titulo:"Dos voces, dos frutos",referencia:"2 Corintios 7:10",desarrollo:"La convicción produce esperanza y regreso; la acusación produce vergüenza y huida. La primera es específica y apunta a Cristo; la segunda es vaga, repetitiva y apunta a ti."},{titulo:"Lo que hace el Consolador",referencia:"Juan 14:26; 16:13-14; Romanos 8:16",desarrollo:"Recuerda las palabras de Jesús, guía a toda verdad, glorifica a Cristo y testifica que eres hijo. Si una voz interior nunca menciona a Cristo y solo habla de ti, no es la suya."},{titulo:"Lo que ya pasó con el acusador",referencia:"Apocalipsis 12:10-11; Zacarías 3:1-4; Romanos 8:33",desarrollo:"Fue lanzado fuera y es vencido por la sangre del Cordero. «¿Quién acusará a los escogidos de Dios?». La acusación puede seguir sonando, pero ya no tiene jurisdicción."}],aplicacion:["Pon a prueba tus pensamientos con tres preguntas: ¿me acerca o me aleja de Dios? ¿me da un paso concreto o solo vergüenza difusa? ¿exalta a Cristo o me hunde a mí?","Responde a la acusación como Jesús respondió a la tentación: con la Palabra escrita (Romanos 8:1; 8:33-34).","Cultiva el testimonio del Espíritu: dedica tiempo a escuchar quién dice Dios que eres, no solo qué debes hacer."],cuidadoPastoral:"El Espíritu sí redarguye al creyente cuando peca (Efesios 4:30 habla de contristarlo), pero siempre como Padre que corrige a un hijo amado, nunca como fiscal que pone en duda si es hijo.",ilustracion:"Zacarías 3: Josué el sumo sacerdote con vestiduras viles, Satanás a su derecha acusando, y el Señor que no discute la acusación sino que ordena: «Quitadle esas vestiduras viles… te he hecho vestir de ropas de gala»."},{id:"dar-sin-miedo",numero:8,serie:1,titulo:"Dar sin miedo",subtitulo:"Generosidad como respuesta, no como impuesto",etiquetas:["Generosidad","Finanzas","Libertad"],necesidades:["finanzas","legalismo"],textoBase:{referencia:"2 Corintios 9:7",texto:"Cada uno dé como propuso en su corazón: no con tristeza, ni por necesidad, porque Dios ama al dador alegre.",version:"RVR1960"},textosApoyo:["2 Corintios 8:1-9","2 Corintios 9:8-11","Gálatas 3:13","Hechos 4:32-35","Hechos 20:35","Mateo 6:3-4, 19-21"],ideaCentral:"Bajo el nuevo pacto la generosidad no se motiva con amenaza de maldición ni se limita a un porcentaje: nace de haber conocido la gracia del que «se hizo pobre siendo rico». Damos desde la bendición, no para evitar el castigo.",porQueNoConvencional:"Es uno de los temas donde más se predica ley a personas del nuevo pacto. Malaquías 3 se usa para amenazar a hijos con una maldición de la que Gálatas 3:13 dice que ya fueron redimidos. Pablo, en los dos capítulos más extensos sobre ofrendas (2 Corintios 8-9), no menciona ni el diezmo ni la maldición: menciona la gracia diez veces.",bosquejo:[{titulo:"La fuente: la gracia de Cristo",referencia:"2 Corintios 8:9",desarrollo:"El dar cristiano empieza contemplando al Dador. «Por amor a vosotros se hizo pobre, siendo rico». Nadie da con alegría lo que no ha recibido primero con asombro."},{titulo:"La forma: libre, alegre y voluntaria",referencia:"2 Corintios 8:3, 12; 9:7",desarrollo:"«Como propuso en su corazón», no como impuso el púlpito. Según lo que uno tiene, no según lo que no tiene. Sin tristeza y sin necesidad: las dos motivaciones que la ley no puede evitar y la gracia elimina."},{titulo:"El fruto: suficiencia y unidad",referencia:"2 Corintios 9:8-11; Hechos 4:32-35",desarrollo:"Dios provee al dador para que siga dando, no para que acumule. Y donde la gracia abunda, «no había entre ellos ningún necesitado». La generosidad es la economía natural del nuevo pacto."}],aplicacion:["Revisa tu motivación al dar: si es miedo a la maldición o cálculo de retorno, vuelve a 2 Corintios 8:9 hasta que dar sea gozo.","Decide con anticipación (como propuso en su corazón), no por presión emocional del momento.","Practica una generosidad «sin recibo»: ayuda a alguien esta semana sin que nadie lo sepa (Mateo 6:3-4)."],cuidadoPastoral:"Que no exista un porcentaje obligatorio no es excusa para dar menos, sino invitación a dar más y mejor. Los macedonios dieron «más allá de sus fuerzas» rogando por el privilegio (2 Corintios 8:3-4). La gracia siempre supera a la ley en generosidad; nunca la reduce. El diezmo puede ser un buen punto de partida voluntario, pero nunca la medida de la aceptación de Dios.",ilustracion:"Nadie ha tenido que amenazar a un enamorado para que compre flores. Cuando el corazón está cautivado, la generosidad es la consecuencia natural; cuando está bajo amenaza, siempre buscará el mínimo."},{id:"la-cena-no-es-un-examen",numero:9,serie:1,titulo:"La Cena no es un examen",subtitulo:"Comer con confianza en la mesa del nuevo pacto",etiquetas:["Comunión","Iglesia","Culpa"],necesidades:["culpa","relaciones"],textoBase:{referencia:"Lucas 22:20",texto:"De igual manera, después que hubo cenado, tomó la copa, diciendo: Esta copa es el nuevo pacto en mi sangre, que por vosotros se derrama.",version:"RVR1960"},textosApoyo:["1 Corintios 11:17-34","Lucas 22:21-34","1 Corintios 10:16-17","Hebreos 10:19-22","Juan 13:1-5"],ideaCentral:"La Cena es la única ordenanza que Jesús vinculó explícitamente al «nuevo pacto». Es proclamación de su muerte, no tribunal de nuestra dignidad. «Examinarse» en 1 Corintios 11 tiene que ver con cómo tratamos al cuerpo (la iglesia), no con una introspección que nos descalifique de la mesa.",porQueNoConvencional:"Generaciones enteras han evitado la mesa por sentirse «indignas», leyendo 1 Corintios 11:28-29 fuera de contexto. Pero el problema en Corinto era que unos comían antes y otros pasaban hambre (vv. 21-22); «no discernir el cuerpo» era despreciar a los hermanos, y la corrección de Pablo es: «esperaos unos a otros» (v. 33). Ninguno es digno; por eso hay una mesa.",bosquejo:[{titulo:"Quiénes estaban en la primera mesa",referencia:"Lucas 22:21-34",desarrollo:"Un traidor, un negador y diez que huirían esa misma noche. Jesús partió el pan para ellos sabiéndolo todo. La primera Cena no fue para los que aprobaron el examen, sino para los que estaban a punto de reprobarlo."},{titulo:"Qué proclamamos al comer",referencia:"1 Corintios 11:26",desarrollo:"La muerte del Señor: es decir, la suficiencia de su sacrificio, no la suficiencia de nuestra semana. Cada vez que comes, predicas que su cuerpo alcanzó para ti."},{titulo:"Qué significa examinarse",referencia:"1 Corintios 11:28-33",desarrollo:"Discernir el cuerpo es ver a los hermanos. El que se examina bien no se retira de la mesa: se reconcilia con quien está sentado a su lado. El examen mira alrededor, no solo hacia adentro."}],aplicacion:["Participa de la Cena no porque te sientas digno, sino porque Él lo es. Deja que el pan te predique.","Antes de comer, mira alrededor: ¿hay alguien con quien necesitas arreglar cuentas? Ese es el examen que Pablo pide.","Si has evitado la mesa por culpa, entiende que fue puesta precisamente para los que necesitan que se les recuerde el perdón."],cuidadoPastoral:"La Cena sigue siendo sagrada y merece reverencia; Pablo advierte de consecuencias reales por tratarla con desprecio. Pero la reverencia bíblica se demuestra en amor al cuerpo, no en ausentarse por temor.",ilustracion:"Un hospital no rechaza pacientes por estar enfermos; sería absurdo. La mesa del Señor es el lugar donde los que fallamos recordamos que «por su llaga fuimos nosotros curados»."},{id:"ya-bendecido",numero:10,serie:1,titulo:"Ya bendecido",subtitulo:"Dejar de pedir lo que ya te fue dado",etiquetas:["Oración","Identidad","Fe"],necesidades:["oracion","miedo"],textoBase:{referencia:"Efesios 1:3",texto:"Bendito sea el Dios y Padre de nuestro Señor Jesucristo, que nos bendijo con toda bendición espiritual en los lugares celestiales en Cristo.",version:"RVR1960"},textosApoyo:["2 Pedro 1:3","Colosenses 2:9-10","Romanos 8:32","Efesios 1:17-19","Filemón 6","Hebreos 4:16"],ideaCentral:"El nuevo pacto no es una lista de bendiciones por alcanzar sino una herencia por descubrir. La oración madura no ruega a Dios que haga lo que ya hizo: pide ojos para ver lo que ya dio y fe para caminar en ello.",porQueNoConvencional:"Buena parte de nuestra oración está en modo «ruego» por cosas que las Escrituras declaran en tiempo pasado: perdón, aceptación, presencia, poder, justicia. Pablo no pide que Dios bendiga a los efesios; pide que conozcan cómo ya fueron bendecidos (Efesios 1:17-18).",bosquejo:[{titulo:"Lo que ya es tuyo",referencia:"Efesios 1:3-14; 2 Pedro 1:3",desarrollo:"Elegidos, adoptados, aceptos, redimidos, perdonados, sellados. Todo en tiempo pasado, todo «en Cristo». «Todas las cosas que pertenecen a la vida y a la piedad nos han sido dadas»."},{titulo:"Por qué no lo vemos",referencia:"Efesios 1:17-18; Filemón 6",desarrollo:"Falta de revelación, no falta de provisión. Pablo ora por «ojos del entendimiento alumbrados», no por más regalos. La fe se vuelve eficaz «en el conocimiento de todo el bien que está en vosotros por Cristo»."},{titulo:"Cómo se ora desde la plenitud",referencia:"Hebreos 4:16; Colosenses 2:10",desarrollo:"Acercarse con confianza para «alcanzar» lo que la gracia ya proveyó. Peticiones que nacen de la posición, no de la orfandad. Estás completo en Él; desde ahí pides."}],aplicacion:["Revisa tus oraciones de esta semana: ¿cuántas piden lo que Dios ya declaró tuyo? Convierte esas peticiones en acciones de gracias.","Haz una lista de los «ya» de Efesios 1-2 y léela en voz alta cada mañana durante siete días.","Ante una necesidad concreta, empieza recordando quién eres y qué tienes antes de pedir lo que te falta."],cuidadoPastoral:"«Toda bendición espiritual» no es promesa de prosperidad material ni de ausencia de pruebas. Es la plenitud de Cristo aplicada al creyente; desde ella seguimos pidiendo el pan de cada día con humildad y dependencia real (Mateo 6:11).",ilustracion:"El hijo pródigo pidió ser tratado como jornalero; el padre lo recibió como hijo. Muchos oramos como jornaleros pidiendo pan cuando el anillo, el vestido y el becerro ya están servidos."},{id:"con-el-rostro-descubierto",numero:11,serie:2,titulo:"Con el rostro descubierto",subtitulo:"Cómo leer toda la Biblia desde el nuevo pacto",etiquetas:["Lectura bíblica","Devocional","Cristo en las Escrituras"],necesidades:["oracion","legalismo"],textoBase:{referencia:"2 Corintios 3:16, 18",texto:"Pero cuando se conviertan al Señor, el velo se quitará. [...] Por tanto, nosotros todos, mirando a cara descubierta como en un espejo la gloria del Señor, somos transformados de gloria en gloria en la misma imagen, como por el Espíritu del Señor.",version:"RVR1960"},textosApoyo:["2 Corintios 3:6-7, 13-15","Lucas 24:27, 32, 44-45","Juan 5:39-40","Hebreos 1:1-2","Romanos 15:4","Gálatas 3:24-25"],ideaCentral:"El Antiguo Testamento no se lee desde el Sinaí sino desde el Calvario. Cuando el lector se vuelve al Señor, el velo se quita: la misma Escritura que producía condenación empieza a producir transformación, porque ya no muestra una lista sino un rostro.",porQueNoConvencional:"Muchos creyentes leen Levítico, Deuteronomio o los Profetas como si fueran Israel antes de la cruz, y salen de su devocional más culpables que cuando entraron. Pablo llama a eso «el velo»: leer el antiguo pacto sin Cristo (3:14). Predicamos «lee tu Biblia» sin enseñar desde dónde leerla, y el resultado es una piedad que se alimenta del ministerio de muerte (3:7) en lugar del ministerio del Espíritu.",bosquejo:[{titulo:"El velo que sigue puesto",referencia:"2 Corintios 3:13-15",desarrollo:"«Hasta el día de hoy, cuando leen el antiguo pacto, les queda el mismo velo». La Escritura leída sin Cristo produce una gloria que se desvanece y una condenación que permanece. No es un problema del texto sino del lector."},{titulo:"El momento en que se quita",referencia:"2 Corintios 3:16; Lucas 24:27, 45",desarrollo:"«Cuando se conviertan al Señor, el velo se quitará». Jesús «les abrió el entendimiento para que comprendiesen las Escrituras», comenzando desde Moisés: toda la Biblia habla de Él. La clave de lectura no es un método sino una Persona."},{titulo:"La lectura que transforma",referencia:"2 Corintios 3:18",desarrollo:"«Mirando a cara descubierta la gloria del Señor, somos transformados de gloria en gloria». El cambio viene por contemplación, no por presión. Uno se parece a lo que mira; por eso el devocional debe terminar mirando a Cristo, no mirándose a uno mismo."}],aplicacion:["Ante cualquier mandato del Antiguo Testamento, pregunta primero «¿cómo lo cumplió Cristo y qué me revela de Él?» antes de «¿qué tengo que hacer?».","Termina cada lectura con una sola pregunta: ¿qué vi de Jesús hoy? Si saliste solo con una lista de tareas, vuelve a leer con el velo quitado.","Lee los Salmos como oraciones de Cristo y en Cristo (Hebreos 2:12; 10:5-7): así dejan de ser el diario de David y se vuelven la voz de tu Sumo Sacerdote."],cuidadoPastoral:"Leer desde Cristo no es descartar el Antiguo Testamento ni convertir cada versículo en alegoría forzada. «Toda la Escritura es inspirada por Dios y útil» (2 Timoteo 3:16). La clave cristológica honra el texto en su contexto y luego lo sigue hasta Cristo; exige más estudio, no menos.",ilustracion:"Los dos de Emaús caminaron once kilómetros con las Escrituras en la memoria y el corazón frío. Cuando Jesús se las explicó «comenzando desde Moisés», el corazón les ardía. La misma Biblia; otro Lector caminando al lado."},{id:"santo-antes-de-comportarte",numero:12,serie:2,titulo:"Santo antes de comportarte",subtitulo:"El indicativo siempre viene antes del imperativo",etiquetas:["Identidad","Santidad","Hábitos"],necesidades:["culpa","habitos"],textoBase:{referencia:"1 Corintios 6:11",texto:"Y esto erais algunos; mas ya habéis sido lavados, ya habéis sido santificados, ya habéis sido justificados en el nombre del Señor Jesús, y por el Espíritu de nuestro Dios.",version:"RVR1960"},textosApoyo:["1 Corintios 1:2","Romanos 6:2, 11","Hebreos 10:10, 14","Colosenses 3:1-5, 12","Efesios 4:1","1 Pedro 1:15-16"],ideaCentral:"El Nuevo Testamento nunca dice «compórtate para llegar a ser santo»; dice «eres santo, ahora vive como tal». La gramática de las epístolas es la gramática de la gracia: primero quién eres, después qué haces. Invertir el orden produce culpa crónica; respetarlo produce cambio real.",porQueNoConvencional:"A una iglesia con divisiones, pleitos entre hermanos, inmoralidad y borracheras en la Cena, Pablo la llama «santificados en Cristo Jesús» en el primer versículo de la carta. No espera a que se comporten para llamarlos santos; los llama santos para que se comporten. Nosotros solemos predicar la santidad como escalera que se sube, cuando el texto la presenta primero como posición que se recibe.",bosquejo:[{titulo:"Lo que erais y lo que ya sois",referencia:"1 Corintios 6:9-11",desarrollo:"Tres «ya» en tiempo pasado: lavados, santificados, justificados. Pablo no lo dice al final de la exhortación como premio, sino al principio como fundamento. La identidad es el punto de partida, no la meta."},{titulo:"La contabilidad de la fe",referencia:"Romanos 6:11; Colosenses 3:1-3",desarrollo:"«Consideraos muertos al pecado». La obediencia comienza con un cálculo de identidad, no con un esfuerzo de voluntad. «Buscad las cosas de arriba» se apoya en «habéis resucitado con Cristo»: el imperativo cuelga del indicativo."},{titulo:"Vestirse de lo que ya eres",referencia:"Colosenses 3:12; Efesios 4:1",desarrollo:"«Vestíos, pues, como escogidos de Dios, santos y amados». «Andad como es digno de la vocación con que fuisteis llamados». La conducta es el vestido de la identidad, no su causa."}],aplicacion:["Cambia tu vocabulario interno: de «soy un pecador que intenta ser santo» a «soy un santo que todavía peca». El texto respalda el segundo.","En la tentación, sustituye el «no debo» por «eso no es quien soy» (Romanos 6:2: los que hemos muerto al pecado, ¿cómo viviremos aún en él?).","Llama a tus hermanos por su identidad y no por su fracaso. Pablo lo hizo con Corinto, y la carta terminó produciendo arrepentimiento (2 Corintios 7:9)."],cuidadoPastoral:"«Santo» en posición no significa «perfecto» en práctica. Hebreos 10:14 une las dos cosas: «con una sola ofrenda hizo perfectos para siempre a los santificados», literalmente «a los que están siendo santificados». La santificación progresiva es real, pero crece de la raíz de la santificación posicional, nunca al revés.",ilustracion:"Un príncipe no se comporta bien para llegar a ser hijo del rey; se comporta como hijo porque ya lo es. Si actúa como plebeyo no deja de ser príncipe, pero vive por debajo de su nombre. Pablo escribe a príncipes que viven como plebeyos y les recuerda su apellido."},{id:"cristo-se-sento",numero:13,serie:2,titulo:"Cristo se sentó",subtitulo:"Los sacrificios que tú sigues ofreciendo",etiquetas:["Obra terminada","Culpa","Conciencia"],necesidades:["culpa","cansancio"],textoBase:{referencia:"Hebreos 10:11-12",texto:"Y ciertamente todo sacerdote está día tras día ministrando y ofreciendo muchas veces los mismos sacrificios, que nunca pueden quitar los pecados; pero Cristo, habiendo ofrecido una vez para siempre un solo sacrificio por los pecados, se ha sentado a la diestra de Dios.",version:"RVR1960"},textosApoyo:["Hebreos 10:1-4, 14, 18","Hebreos 9:12, 25-26","Hebreos 1:3","Hebreos 9:14; 10:22","Juan 19:30","Salmo 110:1"],ideaCentral:"En el tabernáculo no había sillas porque el trabajo del sacerdote nunca terminaba. Cristo se sentó porque el suyo sí. Cada vez que intentas «pagar» una falla con autocastigo, con un ayuno penitencial o con semanas de distancia de Dios, estás ofreciendo sacrificios que Él ya declaró innecesarios.",porQueNoConvencional:"Hablamos de la obra terminada, pero muchos creyentes practican una penitencia emocional no declarada: sienten que deben sufrir un tiempo prudente antes de «merecer» volver a la comunión. Hebreos 10:18 es tajante: «donde hay remisión de éstos, no hay más ofrenda por el pecado». Ninguna. Tampoco la tuya.",bosquejo:[{titulo:"Sacerdotes de pie",referencia:"Hebreos 10:1-4, 11",desarrollo:"La repetición era la confesión de la insuficiencia: «en estos sacrificios cada año se hace memoria de los pecados». La religión de repetición produce memoria de pecado, no limpieza de conciencia. Un sacerdote que nunca se sienta es un sistema que nunca termina."},{titulo:"El Sacerdote sentado",referencia:"Hebreos 10:12-14; 1:3",desarrollo:"«Se ha sentado» es «consumado es» convertido en postura. Una sola ofrenda, una sola vez, para siempre, perfectos. No se sentó por cansancio sino por conclusión: no queda nada que añadir."},{titulo:"La conciencia limpia",referencia:"Hebreos 9:14; 10:2, 22",desarrollo:"La meta del nuevo pacto es un adorador que «no tenga ya más conciencia de pecado». Vivir con la conciencia purificada no es descuido espiritual: es el fruto proclamado del sacrificio. Acercarse «con corazón sincero, en plena certidumbre de fe» es honrar lo que Él hizo."}],aplicacion:["Identifica tus «sacrificios repetidos»: ¿qué haces para sentirte otra vez digno después de fallar? Nómbralos y renuncia a ellos como quien deja un altar que ya no existe.","Practica volver a la comunión inmediatamente después de confesar, sin período de «cuarentena espiritual». El tiempo de espera no limpia nada; la sangre ya lo hizo.","Cuando la conciencia acuse un pecado ya confesado, responde en voz alta con Hebreos 10:18, y siéntate tú también."],cuidadoPastoral:"Que no haya más ofrenda no elimina la confesión (1 Juan 1:9), la restitución (Lucas 19:8) ni la reparación de relaciones dañadas (Mateo 5:23-24). Esas no son pagos a Dios; son frutos de una conciencia ya limpia que ahora ama. La diferencia está en la dirección: no obras para ser perdonado, obras porque lo fuiste.",ilustracion:"Entre el mobiliario del tabernáculo había candelero, mesa, altar del incienso, altar de bronce, fuente y arca... pero ninguna silla. Hebreos convierte esa ausencia en teología: el trabajo nunca terminaba. El primer asiento del santuario es el trono donde Cristo se sentó."},{id:"el-duro-trato-del-cuerpo-no-sirve",numero:14,serie:2,titulo:"El duro trato del cuerpo no sirve",subtitulo:"Por qué las reglas autoimpuestas no vencen a la carne",etiquetas:["Hábitos","Legalismo","Espíritu"],necesidades:["habitos","legalismo"],textoBase:{referencia:"Colosenses 2:21, 23",texto:"No manejes, ni gustes, ni aun toques [...]. Tales cosas tienen a la verdad cierta reputación de sabiduría en culto voluntario, en humildad y en duro trato del cuerpo; pero no tienen valor alguno contra los apetitos de la carne.",version:"RVR1960"},textosApoyo:["Colosenses 2:20-22; 3:1-5","Gálatas 5:16-18","Romanos 7:8; 8:13","1 Timoteo 4:1-5, 8","Mateo 15:11, 18-19","Filipenses 4:8"],ideaCentral:"Las reglas que uno mismo se impone y el castigo del cuerpo parecen muy espirituales, pero Pablo dice que no tienen ningún valor contra la carne. El pecado no se vence apretando desde afuera sino viviendo desde arriba: «haced morir» (3:5) viene después de «buscad las cosas de arriba» (3:1), nunca antes.",porQueNoConvencional:"En muchas iglesias, a más lucha, más reglas: más prohibiciones, más «no toques», más dureza consigo mismo. Pablo llama a eso «culto voluntario» (ethelothreskía: religión inventada por uno mismo) y le concede reputación de sabiduría con valor cero. Es contraintuitivo y liberador: el problema del legalista no es que sea demasiado estricto, sino que su estrategia no funciona.",bosquejo:[{titulo:"Reglas con buena reputación",referencia:"Colosenses 2:20-23",desarrollo:"«No manejes, ni gustes, ni aun toques». Suenan a humildad y disciplina, y por eso engañan. Pablo las llama mandamientos de hombres, sombra de lo que ya llegó, y las declara inútiles contra lo que pretenden controlar."},{titulo:"Por qué no funcionan",referencia:"Romanos 7:8; Mateo 15:18-19; Gálatas 5:17",desarrollo:"El mandamiento despierta el deseo que quiere apagar. El problema no está en el objeto prohibido sino en el corazón que lo desea. El cuerpo no es el enemigo; la carne, el yo que vive independiente de Dios, sí. Y a la carne no se le vence con más carne."},{titulo:"La estrategia del nuevo pacto",referencia:"Colosenses 3:1-5; Gálatas 5:16; Romanos 8:13",desarrollo:"Primero «buscad las cosas de arriba» y «vuestra vida está escondida con Cristo»; después «haced morir». «Andad en el Espíritu, y no satisfagáis los deseos de la carne»: la mortificación real es obra del Espíritu en alguien lleno de Cristo, no obra del reglamento en alguien vacío."}],aplicacion:["Haz una lista de las reglas que te has puesto para «controlarte». Pregunta por cada una: ¿nace de mi unión con Cristo o de mi desconfianza en Él?","Sustituye cada «no toques» por un «sí» mayor: llena la vida de lo que es de arriba (Filipenses 4:8) en lugar de solo vaciarla. Lo vacío se vuelve a llenar con lo mismo.","Cuando falles, revisa no solo la conducta sino la fuente: ¿estabas viviendo desde la aceptación o desde el esfuerzo? La recaída casi siempre nace del segundo."],cuidadoPastoral:"El texto no elimina la disciplina: Pablo golpea su cuerpo (1 Corintios 9:27) y manda ejercitarse para la piedad (1 Timoteo 4:7). La diferencia está en la fuente y el propósito: entrenamiento que nace de la gracia (Tito 2:12) frente a castigo que intenta producirla. Los límites sabios son fruto del Espíritu, no sustituto del Espíritu.",ilustracion:"Arrancar los frutos podridos de un árbol enfermo y colgarle frutos de plástico no cura el árbol. Jesús dijo que el árbol bueno da fruto bueno (Mateo 7:17): la gracia sana la raíz; la regla solo decora las ramas."},{id:"cuando-dios-corrige-no-cobra",numero:15,serie:2,titulo:"Cuando Dios corrige, no cobra",subtitulo:"Disciplina de Padre, no castigo de juez",etiquetas:["Pruebas","Miedo","Paternidad de Dios"],necesidades:["miedo","culpa"],textoBase:{referencia:"Hebreos 12:6, 10",texto:"Porque el Señor al que ama, disciplina, y azota a todo el que recibe por hijo. [...] Y aquéllos, ciertamente por pocos días nos disciplinaban como a ellos les parecía, pero éste para lo que nos es provechoso, para que participemos de su santidad.",version:"RVR1960"},textosApoyo:["Hebreos 12:5-11","Isaías 53:5","Romanos 8:1, 28","1 Juan 4:18","Juan 15:2","Salmo 103:10, 13","Juan 9:3"],ideaCentral:"El castigo penal por tus pecados cayó completo sobre Cristo, así que lo que Dios hace hoy contigo nunca es cobrar: es formar. La disciplina del nuevo pacto mira hacia adelante (lo que serás), no hacia atrás (lo que hiciste).",porQueNoConvencional:"Cuando algo sale mal, el reflejo de muchos creyentes es «Dios me está castigando por...». Eso mezcla dos categorías que la cruz separó para siempre: castigo (retributivo, de juez, ya pagado) y disciplina (formativa, de Padre, en curso). Confundirlas produce un cristianismo que vive con miedo; distinguirlas produce confianza incluso en el dolor.",bosquejo:[{titulo:"El castigo ya fue pagado",referencia:"Isaías 53:5; Romanos 8:1; 1 Juan 4:18",desarrollo:"«El castigo de nuestra paz fue sobre él». Ninguna condenación. El temor «lleva en sí castigo», y por eso el que espera castigo de Dios todavía no ha entendido lo que pasó en la cruz. No hay doble cobro en el nuevo pacto."},{titulo:"La disciplina es prueba de filiación",referencia:"Hebreos 12:6-8",desarrollo:"«Si se os deja sin disciplina, sois bastardos, y no hijos». Dios disciplina a los que ya son hijos, no para que lleguen a serlo. La corrección no pone en duda la relación: la confirma."},{titulo:"El propósito es la participación, no el pago",referencia:"Hebreos 12:10-11; Juan 15:2",desarrollo:"«Para que participemos de su santidad»; «fruto apacible de justicia». El Padre poda al que ya lleva fruto para que lleve más. La disciplina no te quita algo que debías: te da algo que todavía no tenías."}],aplicacion:["Ante una prueba, cambia la pregunta «¿qué hice mal?» por «¿qué está formando el Padre en mí?». No toda prueba es disciplina (Juan 9:3), pero toda prueba puede ser formación.","Recibe la corrección de la Palabra o de un hermano sin ponerte a la defensiva: el que está seguro de ser hijo puede escuchar una reprensión sin desmoronarse.","Cuando disciplines a tus hijos o discípulos, hazlo como Hebreos 12: hacia adelante, con propósito claro y sin humillación."],cuidadoPastoral:"Evita dos extremos: atribuir todo sufrimiento a disciplina (Job y Juan 9 lo desmienten) o negar que Dios discipline (Hebreos 12 es explícito). La disciplina puede doler de verdad, «no parece ser causa de gozo, sino de tristeza», pero siempre llega envuelta en la ternura del Padre que «se compadece de los hijos» (Salmo 103:13).",ilustracion:"Un cirujano y un asaltante pueden usar un cuchillo sobre el mismo cuerpo; la diferencia no está en el dolor sino en la intención y el resultado. La disciplina corta para sanar; el castigo corta para cobrar. La cruz garantiza que Dios solo usa el primer bisturí contigo."},{id:"sacerdotes-sin-templo",numero:16,serie:2,titulo:"Sacerdotes sin templo",subtitulo:"Tu lunes también es culto",etiquetas:["Trabajo","Vocación","Adoración"],necesidades:["cansancio","finanzas"],textoBase:{referencia:"Colosenses 3:23-24",texto:"Y todo lo que hagáis, hacedlo de corazón, como para el Señor y no para los hombres; sabiendo que del Señor recibiréis la recompensa de la herencia, porque a Cristo el Señor servís.",version:"RVR1960"},textosApoyo:["1 Pedro 2:5, 9","Hebreos 13:15-16","Romanos 12:1","1 Corintios 10:31","Juan 4:21-24","Génesis 2:15","Efesios 6:5-8"],ideaCentral:"El nuevo pacto no tiene templo de piedra ni casta sacerdotal: todo creyente es sacerdote y cualquier lugar puede ser santuario. Tu escritorio, tu taller y tu cocina son altares donde ofreces «sacrificios espirituales». La división entre lo espiritual del domingo y lo secular del lunes murió con el velo rasgado.",porQueNoConvencional:"Muchos creyentes viven una espiritualidad de dos pisos: el «ministerio» arriba y el «trabajo» abajo, con culpa permanente por no dedicarse a lo primero. Pero Pablo les dice a esclavos que sirven a amos terrenales: «a Cristo el Señor servís». El púlpito más grande de la mayoría de la iglesia no está en el templo sino en su lugar de trabajo, y casi nadie se lo ha dicho.",bosquejo:[{titulo:"Sin templo y sin monte",referencia:"Juan 4:21-24; 1 Pedro 2:5, 9",desarrollo:"«Ni en este monte ni en Jerusalén». Los verdaderos adoradores adoran en espíritu y en verdad. «Vosotros sois real sacerdocio»: el edificio no es el templo; tú lo eres, y vas contigo a todas partes."},{titulo:"Los sacrificios del nuevo pacto",referencia:"Hebreos 13:15-16; Romanos 12:1",desarrollo:"Alabanza, hacer el bien, compartir, presentar el cuerpo. Ninguno requiere un altar de piedra; todos requieren un lunes. «De tales sacrificios se agrada Dios»: la ofrenda del nuevo pacto es la vida ordinaria entregada."},{titulo:"Trabajar como para el Señor",referencia:"Colosenses 3:23-24; 1 Corintios 10:31",desarrollo:"«De corazón», literalmente «desde el alma». Del Señor viene la recompensa de la herencia. La excelencia, la honestidad y la puntualidad laborales son adoración; el trabajo mediocre «para el Señor» es una contradicción."}],aplicacion:["Dedica tu lugar de trabajo como altar: el lunes por la mañana ora sobre tu escritorio, tu taller, tu aula o tu cocina.","Haz tu trabajo con excelencia esta semana sabiendo que el Jefe real está mirando, no para impresionar a nadie sino porque a Él le sirves.","Cambia la pregunta «¿cómo salgo de aquí para servir a Dios?» por «¿cómo sirvo a Dios aquí?». Ya estás en ministerio a tiempo completo."],cuidadoPastoral:"Que todo sea culto no vuelve prescindible la reunión de la iglesia (Hebreos 10:25): lo congregacional alimenta lo cotidiano. Y trabajar «como para el Señor» no justifica el exceso de trabajo ni el descuido de la familia: el Señor para quien trabajas también manda descansar.",ilustracion:"Se atribuye a Lutero la idea de que Dios ordeña las vacas a través de la lechera, y que ella, si trabaja con fe, adora tanto como el monje que reza. El nuevo pacto convierte el establo en santuario."},{id:"la-mesa-que-pedro-abandono",numero:17,serie:2,titulo:"La mesa que Pedro abandonó",subtitulo:"Cuando la gracia se cree pero no se practica",etiquetas:["Comunidad","Prejuicio","Coherencia"],necesidades:["relaciones","legalismo"],textoBase:{referencia:"Gálatas 2:14",texto:"Pero cuando vi que no andaban rectamente conforme a la verdad del evangelio, dije a Pedro delante de todos: Si tú, siendo judío, vives como los gentiles y no como judío, ¿por qué obligas a los gentiles a judaizar?",version:"RVR1960"},textosApoyo:["Gálatas 2:11-13, 21","Hechos 10:28, 34-35","Hechos 11:2-3; 15:8-11","Romanos 14:1-4; 15:7","Efesios 2:14-16","2 Pedro 3:15"],ideaCentral:"Pedro creía la gracia (la había predicado en casa de Cornelio), pero cuando llegaron los de Jerusalén se levantó de la mesa de los gentiles. Pablo no lo acusó de mala doctrina sino de no «andar rectamente conforme a la verdad del evangelio». La gracia se demuestra en con quién te sientas a comer.",porQueNoConvencional:"Solemos pensar que la fidelidad al evangelio es un asunto de creencias correctas. Este pasaje muestra que se puede tener la doctrina impecable y negar el evangelio con los pies. Prejuicio, clasismo, distancia entre «los de siempre» y «los nuevos», recelo hacia otros trasfondos... son formas modernas de levantarse de la mesa mientras se predica la gracia desde el púlpito.",bosquejo:[{titulo:"Una verdad ya aprendida",referencia:"Hechos 10:28, 34; 15:11",desarrollo:"Dios le había mostrado a Pedro que «a ningún hombre llame común o inmundo». Él mismo diría en el concilio: «por la gracia del Señor Jesús seremos salvos, de igual modo que ellos». Pedro no ignoraba la verdad; la contradijo sabiéndola."},{titulo:"Una mesa abandonada por miedo",referencia:"Gálatas 2:12-13",desarrollo:"«Tenía miedo de los de la circuncisión». El miedo a la opinión religiosa desarma más rápido que la persecución. Y la hipocresía contagia: «aun Bernabé fue también arrastrado». Cuando un líder se levanta de la mesa, la iglesia entera se reorganiza a su alrededor."},{titulo:"Un evangelio que se camina",referencia:"Gálatas 2:14, 21; R
