á muriendo. La casa del luto enseña lo que ningún sermón sobre la eternidad puede enseñar, y el moribundo creyente suele ser el mejor predicador de la esperanza."],cuidadoPastoral:"La muerte sigue siendo «el postrer enemigo» (1 Corintios 15:26), no una amiga; el duelo es legítimo y Pablo prefería «ser revestido» antes que «desnudado» (2 Corintios 5:4). La esperanza cristiana no es solo «ir al cielo» sino la resurrección del cuerpo. Y a quien teme, no se le regaña: se le acompaña hasta que vea al que ya pasó por ahí.",ilustracion:"Un padre y su hijo iban en el auto cuando entró una abeja; el niño, alérgico, gritó aterrado. El padre atrapó la abeja en la mano, la soltó, y el niño volvió a gritar hasta que el padre le mostró la palma: «Mira: el aguijón se quedó aquí. Ya no puede hacerte daño». La muerte todavía zumba, pero el aguijón está en la mano de Cristo."},{id:"enjugara-toda-lagrima",numero:40,serie:4,titulo:"Enjugará toda lágrima",subtitulo:"El nuevo pacto termina en una boda",etiquetas:["Esperanza","Nueva creación","Consumación"],necesidades:["sufrimiento","miedo"],textoBase:{referencia:"Apocalipsis 21:3-4",texto:"Y oí una gran voz del cielo que decía: He aquí el tabernáculo de Dios con los hombres, y él morará con ellos; y ellos serán su pueblo, y Dios mismo estará con ellos como su Dios. Enjugará Dios toda lágrima de los ojos de ellos; y ya no habrá muerte, ni habrá más llanto, ni clamor, ni dolor; porque las primeras cosas pasaron.",version:"RVR1960"},textosApoyo:["Levítico 26:11-12","Jeremías 31:33","Ezequiel 37:26-27","Isaías 25:8","Romanos 8:18-25","1 Juan 3:2-3","Apocalipsis 19:7-9; 22:3, 17","1 Corintios 15:58"],ideaCentral:"La frase «seré su Dios y ellos serán mi pueblo» recorre la Biblia desde Levítico, pasa por la promesa del nuevo pacto en Jeremías y termina en Apocalipsis 21: el destino no es que nosotros escapemos al cielo, sino que Dios se mude con nosotros. Los santos llegan llorando, y Él mismo seca las lágrimas. La última palabra de la Biblia sobre la salvación es «gratuitamente».",porQueNoConvencional:"Mucha predicación sobre el final habla de escapar de la tierra; el texto habla de la nueva Jerusalén descendiendo y de Dios haciendo su tabernáculo entre los hombres: Emanuel completado. También sorprende que haya lágrimas que enjugar: no se nos pide llegar sin llorar, se nos promete que Él las secará. Y el mismo libro que describe juicios cierra con una invitación gratuita: la gracia llega intacta a la última página.",bosquejo:[{titulo:"La frase que recorre toda la Biblia",referencia:"Levítico 26:11-12; Jeremías 31:33; Ezequiel 37:27; Apocalipsis 21:3",desarrollo:"«Pondré mi morada en medio de vosotros… seré vuestro Dios». El pacto siempre fue sobre presencia, no sobre reglas. Del tabernáculo en el desierto, al templo, a Cristo «que habitó entre nosotros», al Espíritu en la iglesia, y finalmente: «Dios mismo estará con ellos». El pacto termina con Dios mudándose a casa."},{titulo:"Las lágrimas que Él mismo enjuga",referencia:"Apocalipsis 21:4; Isaías 25:8; Romanos 8:18-23",desarrollo:"Hay lágrimas al llegar; el llanto no descalifica. «Enjugará Dios toda lágrima»: no un ángel, Él. «Gemimos» ahora, pero «no son comparables las aflicciones del tiempo presente con la gloria venidera». La esperanza no niega el dolor de hoy: lo pone en proporción."},{titulo:"Gratuitamente, hasta la última página",referencia:"Apocalipsis 22:3, 17; 1 Juan 3:2-3; 1 Corintios 15:58",desarrollo:"«No habrá más maldición»; «el que quiera, tome del agua de la vida gratuitamente». La esperanza purifica («todo aquel que tiene esta esperanza en él, se purifica») y pone a trabajar («vuestro trabajo en el Señor no es en vano»). El que sabe cómo termina la historia vive distinto hoy."}],aplicacion:["Lee Apocalipsis 21:1-7 en voz alta cada vez que el dolor presente parezca definitivo. La esperanza no es un sentimiento sino una noticia que se repite hasta que se cree.","Practica la desproporción de Romanos 8:18: escribe tu aflicción actual en una columna y, en la otra, lo que Dios ha prometido. Míralas juntas.","Deja que la esperanza te ponga a trabajar: invierte esta semana en algo que dure (una persona, una reconciliación, una obra de justicia). Nada hecho en el Señor se pierde."],cuidadoPastoral:"La esperanza cristiana no es escapismo ni excusa para desentenderse del mundo: 1 Corintios 15:58 sigue inmediatamente al capítulo de la resurrección y manda a trabajar «abundando siempre». Y las «primeras cosas» que pasan incluyen el dolor real de personas reales: hablar del final sin sentarse en el presente de los que sufren es usar el cielo como anestesia. Primero se llora con ellos; después se les muestra quién secará las lágrimas.",ilustracion:"La Biblia comienza con una boda en un jardín y termina con una boda en una ciudad. Entre ambas hay un divorcio, un exilio, una cruz y una tumba vacía. Y la última invitación del libro no dice «merécelo» sino «el que quiera, tome gratuitamente». La gracia abre la historia y la gracia la cierra."},{id:"la-persona-de-fe-sabe-cambiar-de-plan",numero:41,serie:2,titulo:"La persona de fe también sabe cambiar de plan",subtitulo:"Puertas cerradas, planes en lápiz y el «sí» que no cambia",etiquetas:["Planes","Dirección","Humildad"],necesidades:["ansiedad","legalismo"],textoBase:{referencia:"Santiago 4:13-15",texto:"¡Vamos ahora! los que decís: Hoy y mañana iremos a tal ciudad, y estaremos allá un año, y traficaremos, y ganaremos; cuando no sabéis lo que será mañana. Porque ¿qué es vuestra vida? Ciertamente es neblina que se aparece por un poco de tiempo, y luego se desvanece. En lugar de lo cual deberíais decir: Si el Señor quiere, viviremos y haremos esto o aquello.",version:"RVR1960"},textosApoyo:["Hechos 16:6-10","Santiago 4:16; 4:6","Proverbios 16:9; 19:21; 27:1","2 Corintios 1:15-20, 23","Romanos 1:13; 15:32","Hechos 18:21","Génesis 50:20"],ideaCentral:"Cambiar de plan no es falta de fe; a veces es la prueba de que la fe está puesta en Dios y no en el plan. Santiago no condena planear sino planear sin Dios, y Hechos 16 muestra al mejor misionero de la historia recibiendo dos «no» del Espíritu antes de un «sí» que cambió un continente. La persona de fe escribe sus planes en lápiz porque la promesa de Dios está escrita en tinta.",porQueNoConvencional:"En muchas iglesias se predica una fe que «declara» y «no se mueve», donde revisar el rumbo suena a derrota y una puerta cerrada se interpreta como ataque o falta de fe. Pero Pablo cambió de plan varias veces (Asia, Bitinia, Corinto, Roma) y lo defendió con toda tranquilidad cuando lo acusaron de ser voluble: su seguridad no estaba en su agenda sino en el «sí» de Dios en Cristo. La rigidez que llamamos fe es a menudo la «jactancia» que Santiago llama mala.",bosquejo:[{titulo:"Planear es bueno; presumir es arrogancia",referencia:"Santiago 4:13-16; Proverbios 27:1",desarrollo:"El comerciante de Santiago tiene ciudad, calendario, negocio y ganancia calculados. Santiago no le reprocha la planificación sino la omisión: planea como si fuera dueño del mañana. «Si el Señor quiere» no es una fórmula supersticiosa sino una postura del corazón: soy niebla, Él es eterno; propongo, Él dispone. La misma carta dice que Dios «da gracia a los humildes» (4:6): el que planea con la mano abierta recibe más gracia que el que planea con el puño cerrado."},{titulo:"Cuando el Espíritu cierra la puerta",referencia:"Hechos 16:6-10; Proverbios 16:9",desarrollo:"El plan de Pablo era excelente: predicar en Asia. El Espíritu lo prohibió. Intentó Bitinia: tampoco. Dos puertas cerradas seguidas a un apóstol lleno del Espíritu en plena obediencia. Lo notable es que no se sentó frente a la puerta cerrada a lamentarse: siguió caminando hasta Troas, y allí, no antes, llegó la visión de Macedonia. El «no» de Asia fue el «sí» de Europa: Filipos, Lidia, el carcelero. (Años después Pablo sí predicaría en Asia: Hechos 19. No era un «nunca», era un «todavía no».)"},{titulo:"Cambiar de plan sin perder la paz",referencia:"2 Corintios 1:15-20, 23",desarrollo:"Pablo prometió visitar Corinto dos veces y no fue. Lo acusaron de ligereza, de decir «sí, sí» y «no, no». Su defensa es una joya: cambió el plan por consideración a ellos («solo por consideración a ustedes»), y su fiabilidad no descansa en su agenda sino en Cristo, en quien todas las promesas de Dios son «sí». La gracia permite cambiar de rumbo sin vergüenza ni pánico: mis planes pueden decir «no», pero el «sí» de Dios sobre mi vida no cambia."}],aplicacion:["Escribe tus planes de este año y añade al final, con sinceridad y no como fórmula: «si el Señor quiere». Luego pregúntate cuál de ellos te costaría más soltar. Ahí está tu «Asia».","Si estás frente a una puerta cerrada, no acampes delante de ella: sigue caminando fielmente hasta tu Troas. La visión suele llegar en movimiento, no en la queja.","Antes de cambiar un plan, aplica el criterio de Pablo: ¿lo hago por consideración a otros y por obediencia, o por miedo y comodidad? Y cuando alguien más cambie de plan, no lo llames voluble antes de escuchar su razón."],cuidadoPastoral:"Este tema no es licencia para la informalidad ni para romper compromisos: el mismo Pablo insiste en que su «sí» era «sí» (1:18) y que la palabra dada importa. Tampoco toda puerta cerrada es Dios; a veces es pereza, miedo o falta de perseverancia, y el discernimiento se hace en comunidad y con la Palabra. Y a quien acaba de ver derrumbarse un plan muy querido, no le predique Proverbios 16:9 como consuelo rápido: primero llore con él; después, cuando pueda oírlo, muéstrele Troas.",ilustracion:"Cuando uno se pasa la salida en la autopista, el GPS no grita ni pone el viaje en pausa por castigo: dice «recalculando» y traza una nueva ruta desde donde estás. Hechos 16 es el «recalculando» de Dios: no anuló el destino, cambió la ruta. La gracia recalcula; la ley solo anota la salida que perdiste."},{id:"leer-la-biblia-no-es-consultar-un-horoscopo",numero:42,serie:2,titulo:"Leer la Biblia no es consultar un horóscopo",subtitulo:"De la «palabra del día» a la Palabra que transforma",etiquetas:["Lectura bíblica","Devocional","Discernimiento"],necesidades:["oracion","ansiedad"],textoBase:{referencia:"Lucas 24:27; 2 Timoteo 3:16-17",texto:"Y comenzando desde Moisés, y siguiendo por todos los profetas, les declaraba en todas las Escrituras lo que de él decían. [...] Toda la Escritura es inspirada por Dios, y útil para enseñar, para redargüir, para corregir, para instruir en justicia, a fin de que el hombre de Dios sea perfecto, enteramente preparado para toda buena obra.",version:"RVR1960"},textosApoyo:["2 Timoteo 3:14-15","Lucas 24:32, 44-45","Mateo 4:5-7; 22:29","Juan 5:39-40","Salmo 119:105; Salmo 1:2-3","Hechos 17:11; 8:30-31","2 Pedro 1:20-21","Romanos 15:4"],ideaCentral:"El horóscopo se consulta: es breve, habla de mí, promete adivinar mi día y no exige nada. La Biblia se habita: es una historia larga que habla de Cristo, no predice mi día sino que forma mi vida, y pide continuidad («desde tu niñez»). Abrirla al azar buscando una señal es tratar a la Palabra viva como a un oráculo mudo. Leerla desde Cristo y con constancia es dejar que ella nos lea a nosotros.",porQueNoConvencional:"Muchos creyentes sinceros practican una «ruleta bíblica» piadosa: abren en cualquier página, señalan un versículo y lo toman como mensaje personal para el día, igual que otros leen su signo. Casi nadie predica contra eso porque parece devoción. Pero el diablo usó exactamente ese método en el desierto, un salmo aislado de su historia, y Jesús le respondió con «también está escrito»: la Escritura se interpreta con la Escritura. Este tema no quita la expectativa de oír a Dios; le devuelve el método que Él mismo usó en Emaús.",bosquejo:[{titulo:"El diablo también cita versículos",referencia:"Mateo 4:5-7; Juan 5:39-40",desarrollo:"En la segunda tentación Satanás cita el Salmo 91 con precisión, pero arrancado de su contexto y puesto al servicio de un capricho: «tírate». Jesús no discute el versículo; lo devuelve a la historia completa: «también está escrito». Un versículo aislado puede decir cualquier cosa; por eso el horóscopo bíblico es tan peligroso: confirma lo que ya queríamos hacer. Y Juan 5 añade el segundo error: se puede estudiar la Biblia con diligencia y nunca llegar a Cristo. Los fariseos la usaban como fuente de vida en sí misma; ella solo señala al que da vida."},{titulo:"La Biblia es una historia, no un oráculo",referencia:"Lucas 24:27, 32, 44-45",desarrollo:"Camino a Emaús, Jesús no dio a los discípulos un versículo para ese día: les recorrió «todas las Escrituras», desde Moisés, mostrando que todas hablaban de Él. El corazón les ardió cuando entendieron la historia entera, no cuando recibieron una frase. La Biblia tiene un centro (Cristo) y una trama (creación, caída, promesa, cruz, resurrección, nueva creación). Leerla en fragmentos sin trama es como leer la última línea de una carta de amor y creer que ya se conoce al remitente."},{titulo:"La Palabra forma; no adivina",referencia:"2 Timoteo 3:14-17; Salmo 119:105; Hechos 17:11",desarrollo:"Pablo le recuerda a Timoteo que conoce las Escrituras «desde la niñez» y le pide «permanecer»: la Palabra actúa por acumulación y continuidad, no por golpes de suerte. Su utilidad no es predictiva sino formativa: enseñar, reprender, corregir, instruir, para que el siervo de Dios esté «enteramente capacitado». El Salmo 119 no promete un mapa del futuro sino una lámpara a los pies: luz para el paso siguiente. Y los de Berea examinaban las Escrituras «todos los días»: la constancia es la diferencia entre consultar un signo y caminar con una Persona."}],aplicacion:["Cambia el «versículo al azar» por un libro completo: lee un evangelio de principio a fin en las próximas cuatro semanas, un capítulo al día, y anota qué te muestra de Cristo, no solo qué te dice de tu día.","Cuando un versículo te impacte, hazle tres preguntas antes de aplicártelo: ¿a quién se lo dijo Dios?, ¿qué dice el párrafo completo?, ¿cómo se cumple en Cristo? Así se lee «también está escrito».","Lee acompañado: como el etíope necesitó a Felipe (Hechos 8:30-31), únete a un grupo de estudio o busca a alguien que lleve más años caminando en la Palabra. La lectura solitaria y fragmentaria es el terreno favorito del horóscopo espiritual."],cuidadoPastoral:"Dios sí habla por medio de versículos concretos en momentos concretos: el Espíritu aplica la Palabra al corazón, y muchos hemos recibido consuelo exacto en un texto «casual». No se trata de burlarse de esas experiencias ni de convertir la lectura en un ejercicio académico frío que nunca espera oír a Dios (Mateo 22:29 reprende por igual ignorar las Escrituras y el poder de Dios). Se trata de corregir un método usado como hábito: buscar señales en lugar de buscar a Cristo, y usar versículos para justificar decisiones ya tomadas. La meta es más expectativa de oír a Dios, no menos, pero en el cauce que Él mismo trazó.",ilustracion:"Se cuenta de un hombre que buscaba dirección abriendo la Biblia al azar. La primera vez cayó en «Judas fue y se ahorcó». Inquieto, probó de nuevo: «Ve y haz tú lo mismo». Desesperado, lo intentó una tercera vez: «Lo que vas a hacer, hazlo pronto». La anécdota hace reír, pero describe con exactitud lo que ocurre cuando tratamos a la Palabra como un oráculo: obtenemos frases sin historia, y las frases sin historia pueden mandarnos a cualquier parte."},...Kv,...$v,...Iv,...Fv],Ea=ox.map(r=>{const c=Wv[r.id],d=ex[r.id]??r.textoBaseNVI;return{...r,textoBaseNVI:d,bosquejo:r.bosquejo.map((l,m)=>({...l,versiculos:c?.[m]?.length?c[m]:l.versiculos}))}}),nx=[{titulo:"Bíblico antes que ingenioso",texto:"Cada tema nace de un texto, no de una ocurrencia. El título llama la atención; el pasaje sostiene el peso."},{titulo:"Práctico para el lunes",texto:"Si la gente no sabe qué hacer distinto el lunes por la mañana, todavía no terminamos de preparar el mensaje."},{titulo:"Poco convencional",texto:"Cada tema aborda un ángulo poco predicado o corrige una l ido que predicaran la palabra en la provincia de Asia. Cuando llegaron cerca de Misia, intentaron pasar a Bitinia, pero el Espíritu de Jesús no se lo permitió. Entonces, pasando de largo por Misia, bajaron a Troas. Durante la noche Pablo tuvo una visión en la que un hombre de Macedonia, puesto de pie, rogaba: «Pasa a Macedonia y ayúdanos». Después de que Pablo tuvo la visión, enseguida nos preparamos para partir hacia Macedonia, convencidos de que Dios nos había llamado a anunciar las buenas noticias a los macedonios.","2 Corintios 9:7":"Cada uno debe dar según lo que haya decidido en su corazón, no de mala gana ni por obligación, porque Dios ama al que da con alegría.","Números 35:6":"De las ciudades que recibirán los levitas, seis serán ciudades de refugio. A ellas podrá huir cualquiera que haya matado a alguien. Además de estas seis ciudades, les entregarán otras cuarenta y dos.","Hebreos 6:18":"Lo hizo así para que, mediante la promesa y el juramento, que son dos realidades que nunca cambian y en las cuales es imposible que Dios mienta, tengamos un estímulo poderoso los que, buscando refugio, nos aferramos a la esperanza que está delante de nosotros.","Hebreos 4:9-10":"Por consiguiente, queda todavía un reposo especial para el pueblo de Dios; porque el que entra en el reposo de Dios descansa también de sus obras, así como Dios descansó de las suyas.","Tito 2:11-12":"En verdad, Dios ha manifestado a toda la humanidad su gracia, la cual trae salvación y nos enseña a rechazar la impiedad y las pasiones mundanas. Así podremos vivir en este mundo con dominio propio, justicia y devoción…","Lucas 24:27":"Entonces, comenzando por Moisés y por todos los Profetas, les explicó lo que se refería a él en todas las Escrituras.","2 Timoteo 3:14-17":"Pero tú permanece firme en lo que has aprendido y de lo cual estás convencido, pues sabes de quiénes lo aprendiste. Desde tu niñez conoces las Sagradas Escrituras, que pueden darte la sabiduría necesaria para la salvación mediante
